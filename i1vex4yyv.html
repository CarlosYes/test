<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - ARÁBIA SAUDITA FOCUS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 5px; overflow: hidden; }
        
        .container { 
            width: 440px; background: #000; border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7); display: flex; flex-direction: column; position: relative;
        }

        .title { font-size: 22px; text-align: center; font-weight: 900; color: #ff0000; padding: 12px; text-shadow: 0 0 10px #ff0000; letter-spacing: 3px; }
        #canvas-globe { width: 100%; height: 320px; background: #000; cursor: grab; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 12px 20px; background: rgba(150, 0, 0, 0.2); 
            border-top: 1px solid #ff0000; border-bottom: 1px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
        }
        .live-indicator { font-size: 20px; font-weight: 900; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        #time { font-size: 20px; font-weight: bold; color: #fff; font-family: monospace; }

        .globe-label {
            display: flex; align-items: center; gap: 10px; padding: 10px 18px;
            background: rgba(0, 0, 0, 0.85); border-radius: 25px; border: 2px solid #ff0000;
            box-shadow: 0 0 20px #ff0000; backface-visibility: hidden;
        }
        .globe-label span {
            color: #ff0000; font-weight: 900; font-size: 22px; text-transform: uppercase;
            text-shadow: 0 0 12px #ff0000; white-space: nowrap;
        }
        .dot-marker { width: 12px; height: 12px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 10px #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">--</span></div>
        <span id="time">00:00:00</span>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // GLOBO ORIGINAL
    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') 
        })
    );
    globeGroup.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.3));

    // --- FOCO NA ARÁBIA SAUDITA ---
    // Coordenadas aproximadas da Arábia Saudita (Lat 23, Lng 45)
    // Convertendo para o espaço 3D para posicionar a câmara de frente
    camera.position.set(1.5, 0.8, 2.0); // Ajustado para iniciar virado para o Médio Oriente
    controls.update();

    let activeMarkers = new Map();

    async function startRadar() {
        try {
            // DETEÇÃO REAL POR IP (SÓ CARREGA SE O IP RESPONDER)
            const res = await fetch('https://ipapi.co/json/');
            const geo = await res.json();
            if(!geo.city) return;

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'RAU-' + Math.random().toString(36).substr(2, 5) });
            const channel = ably.channels.get('radar-saudi-focus-v1');
            
            channel.presence.enter({ city: geo.city.toUpperCase(), lat: geo.latitude, lng: geo.longitude });

            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    if (err) return;
                    document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                    
                    activeMarkers.forEach(m => scene.remove(m.label));
                    activeMarkers.clear();

                    members.forEach(m => {
                        const u = m.data; if(!u || !u.lat) return;
                        const div = document.createElement('div');
                        div.className = 'globe-label';
                        div.innerHTML = `<div class="dot-marker"></div><span>${u.city}</span>`;
                        const label = new THREE.CSS3DSprite(div);
                        label.scale.set(0.0022, 0.0022, 0.0022);
                        
                        const phi = (90 - u.lat) * (Math.PI / 180);
                        const theta = (u.lng + 180) * (Math.PI / 180);
                        label.position.set(-1.08 * Math.sin(phi) * Math.cos(theta), 1.08 * Math.cos(phi), 1.08 * Math.sin(phi) * Math.sin(theta));
                        
                        scene.add(label);
                        activeMarkers.set(m.clientId, {label, lat: u.lat, lng: u.lng});
                    });
                });
            });
        } catch (e) {
            document.getElementById('visNum').innerText = "ERRO";
        }
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.005; // Rotação contínua
        
        activeMarkers.forEach(m => {
            const phi = (90 - m.lat) * (Math.PI / 180);
            const theta = (m.lng + 180) * (Math.PI / 180) + globeGroup.rotation.y;
            m.label.position.set(-1.08 * Math.sin(phi) * Math.cos(theta), 1.08 * Math.cos(phi), 1.08 * Math.sin(phi) * Math.sin(theta));
        });

        renderer.render(scene, camera);
        css3dRenderer.render(scene, camera);
    }

    setInterval(() => { document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); }, 1000);
    startRadar();
    animate();
</script>
</body>
</html>
