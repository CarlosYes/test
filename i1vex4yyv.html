<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v158 - RESILIENT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .d-rau { width: 14px; height: 14px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.6s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(3.5); opacity: 0; } }
        #debug { font-family: monospace; font-size: 10px; color: #39ff14; margin-top: 10px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 10px; letter-spacing: 5px;">RAU SYSTEM v158</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace;">A SINCRONIZAR INFRAESTRUTURA...</div>
    <div id="debug">RTT: -- | IP: --</div>
</div>

<div id="globeViz"></div>

<script>
    const RAU_UID = localStorage.getItem('rau_guid') || 'NODE-' + Math.random().toString(36).substr(2, 9);
    localStorage.setItem('rau_guid', RAU_UID);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png" style="width:20px;height:13px;object-fit:cover;">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function getLatency() {
        try {
            const start = Date.now();
            await fetch('https://speed.cloudflare.com/generate_204', { mode: 'no-cors' });
            return Date.now() - start;
        } catch (e) { return "N/A"; }
    }

    async function startRadar() {
        try {
            const rtt = await getLatency();
            const response = await fetch('https://ipinfo.io/json?token=7563065675409a');
            const data = await response.json();
            
            document.getElementById('debug').innerText = `RTT: ${rtt}ms | IP: ${data.ip}`;

            const [lat, lng] = data.loc.split(',');
            const geo = {
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                city: (data.city || "ORIGIN").toUpperCase(),
                country: data.country || null,
                clientId: RAU_UID
            };

            const ably = new Ably.Realtime({ 
                key: ABLY_KEY, 
                clientId: RAU_UID,
                closeOnUnload: true 
            });

            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `RADAR ATIVO: ${geo.city}`;
                channel.presence.enter(geo);

                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Filtro absoluto de unicidade para matar fantasmas de Mechelen
                            const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.8 }, 2000);
        } catch (e) {
            document.getElementById('status').innerText = "ERRO TÉCNICO - REVER ROTA";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    startRadar();
</script>
</body>
</html>
