<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAU RADAR - ESTRELAS FIXAS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
        
        .container { 
            width: 100%; max-width: 500px; height: 95vh;
            background: #000; border: 2px solid #ff0000; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.4); position: relative;
        }

        .header { 
            position: absolute; top: 0; width: 100%; padding: 20px; 
            text-align: center; z-index: 100; pointer-events: none;
        }
        .title { color: #ff0000; font-weight: bold; letter-spacing: 4px; text-shadow: 0 0 15px #f00; font-size: 20px; }
        
        #status-msg { 
            background: rgba(0,0,0,0.8); color: #39ff14; font-size: 10px; 
            margin-top: 8px; padding: 5px 12px; border-radius: 20px; display: inline-block;
            border: 1px solid rgba(57, 255, 20, 0.3);
        }

        #globeViz { width: 100%; height: 100%; }

        .footer { 
            position: absolute; bottom: 20px; width: 100%; padding: 0 20px;
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }
        .vis-pill { background: #ff0000; color: #fff; padding: 8px 15px; border-radius: 20px; font-weight: bold; border: 1px solid #fff; box-shadow: 0 0 15px #f00; }

        .m-tag { 
            background: rgba(0,0,0,0.9); border: 1px solid #ff0000; padding: 4px 8px;
            color: #fff; font-size: 11px; border-radius: 4px; display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body oncontextmenu="return false">

<div class="container">
    <div class="header">
        <div class="title">RAU RADAR SYSTEM</div>
        <div id="status-msg">SISTEMA INICIALIZADO</div>
    </div>

    <div id="globeViz"></div>

    <div class="footer">
        <div id="time" style="color:#fff; font-weight:bold;">00:00:00</div>
        <div class="vis-pill">LIVE: <span id="count">00</span></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    let myData = { lat: 51.2093, lng: 3.2247, city: "A LOCALIZAR...", country: "be" };
    let ably, channel;

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('rgba(0,0,0,0)') // Fundo transparente para ver as estrelas fixas
        .showAtmosphere(true)
        .atmosphereColor('#ff0000')
        .atmosphereAltitude(0.15)
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center; pointer-events:none;">
                    <div class="m-tag"><img src="https://flagcdn.com/w20/${d.country.toLowerCase()}.png" width="16"> ${d.city}</div>
                    <div style="width:10px; height:10px; background:#f00; border-radius:50%; box-shadow:0 0 15px #f00; border:1px solid #fff; margin-top:5px;"></div>
                </div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // --- ESTRELAS PARADAS (FIRMAMENTO ESTÁTICO) ---
    const scene = world.scene();
    const starGeometry = new THREE.BufferGeometry();
    const starVertices = [];
    // Criamos 10 mil estrelas num raio gigante
    for (let i = 0; i < 10000; i++) {
        const x = THREE.MathUtils.randFloatSpread(5000);
        const y = THREE.MathUtils.randFloatSpread(5000);
        const z = THREE.MathUtils.randFloatSpread(5000);
        // Garante que as estrelas estão fora do globo
        if (Math.sqrt(x*x + y*y + z*z) > 1000) starVertices.push(x, y, z);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    
    // Material com brilho (opacity)
    const starMaterial = new THREE.PointsMaterial({ 
        color: 0xffffff, 
        size: 0.8, 
        transparent: true, 
        opacity: 0.7 
    });
    
    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);

    // Função para manter as estrelas paradas mesmo quando rodamos o globo
    world.controls().addEventListener('change', () => {
        stars.position.copy(world.camera().position);
    });

    async function initRadar() {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'ID-' + Math.random().toString(36).substr(2, 5) });
        channel = ably.channels.get('malajes-live');

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                const pts = members.map(m => m.data);
                document.getElementById('count').innerText = pts.length.toString().padStart(2, '0');
                world.htmlElementsData(pts);
            });
        });

        if (navigator.geolocation) {
            document.getElementById('status-msg').innerText = "A SOLICITAR GPS REAL...";
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                myData.lat = pos.coords.latitude;
                myData.lng = pos.coords.longitude;
                
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myData.lat}&lon=${myData.lng}`);
                    const json = await res.json();
                    myData.city = (json.address.city || json.address.town || json.address.village || "BRUGES").toUpperCase();
                    myData.country = json.address.country_code;
                } catch(e) { myData.city = "RADAR ATIVO"; }

                document.getElementById('status-msg').innerText = "SINAL GPS: " + myData.city;
                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 2 }, 2000);

            }, async (err) => {
                document.getElementById('status-msg').innerText = "GPS BLOQUEADO. USANDO REDE IP.";
                document.getElementById('status-msg').style.color = "#ffcc00";
                
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                myData = { lat: d.latitude, lng: d.longitude, city: d.city.toUpperCase() + " (IP)", country: d.country_code.toLowerCase() };
                
                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 2 }, 2000);
            }, { enableHighAccuracy: true });
        }
    }

    setInterval(() => { document.getElementById('time').innerText = new Date().toLocaleTimeString(); }, 1000);
    initRadar();
</script>
</body>
</html>
