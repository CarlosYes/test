<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v185 - INDESTRUCTIBLE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        
        .player-hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 500px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid #39ff14;
            border-radius: 10px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(10px); z-index: 1000;
        }

        .info { display: flex; flex-direction: column; }
        .city { color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase; }
        .status-msg { color: #39ff14; font-size: 10px; font-family: monospace; margin-top: 2px; }
        
        .count-tag { background: #39ff14; color: #000; padding: 4px 10px; border-radius: 4px; font-weight: bold; }

        .m-rau { pointer-events: none; }
        .l-rau { background: #000; color: #39ff14; padding: 4px 8px; border: 1px solid #39ff14; border-radius: 4px; font-size: 10px; font-weight: 900; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="player-hud">
    <div class="info">
        <div id="city" class="city">A INICIALIZAR...</div>
        <div id="status" class="status-msg">A PROCURAR SINAL (REDUNDÂNCIA ATIVA)</div>
    </div>
    <div class="count-tag" id="count">0</div>
</div>

<script>
    const RAU_ID = 'RAU-IND-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau">${d.city}</div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    async function fetchGeo() {
        // Redundância 1: BigDataCloud
        try {
            const r = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
            const d = await r.json();
            if (d.latitude) return { lat: d.latitude, lng: d.longitude, city: (d.city || d.locality).toUpperCase() };
        } catch(e) {}

        // Redundância 2: IP-API (Fallback)
        try {
            const r = await fetch('https://ipapi.co/json/');
            const d = await r.json();
            if (d.latitude) return { lat: d.latitude, lng: d.longitude, city: d.city.toUpperCase() };
        } catch(e) {}

        // Redundância 3: Localização de IP direta (Extremo)
        try {
            const r = await fetch('https://ip-api.com/json/');
            const d = await r.json();
            if (d.lat) return { lat: d.lat, lng: d.lon, city: d.city.toUpperCase() };
        } catch(e) {}

        return null;
    }

    async function start() {
        const geo = await fetchGeo();

        if (geo) {
            document.getElementById('city').innerText = geo.city;
            document.getElementById('status').innerText = "CONEXÃO ESTÁVEL";

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);
                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 2 }, 2000);
        } else {
            document.getElementById('city').innerText = "SINAL BLOQUEADO";
            document.getElementById('status').innerText = "VERIFIQUE FIREWALL/VPN";
        }
    }

    start();
</script>
</body>
</html>
