<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        #info-painel {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 50, 0, 0.9); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 100; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="info-painel">A LOCALIZAR VISITANTE...</div>
    <div id="globeViz"></div>

    <script>
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .nightImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#3a228a');

        // Iluminação para o ciclo dia/noite ser visível
        const scene = world.scene();
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(1, 1, 1);
        scene.add(sun);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // FUNÇÃO QUE NÃO FALHA: Captura Cidade e Bandeira
        async function obterLocalizacao() {
            try {
                // Usando a API ip-api (versão JSON que é muito estável)
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                if (data.city) {
                    // Gerar a Bandeira Emoji através do código do país
                    const flag = data.country_code.toUpperCase().replace(/./g, char => 
                        String.fromCodePoint(char.charCodeAt(0) + 127397)
                    );

                    const resultado = `${flag} ${data.city}, ${data.country_name}`;
                    
                    // MOSTRA NO PAINEL (O que tu pediste)
                    document.getElementById('info-painel').innerHTML = `VISITANTE DE: ${resultado}`;

                    // MOSTRA NO GLOBO
                    world.labelsData([{ lat: data.latitude, lng: data.longitude, text: resultado }])
                        .labelSize(3)
                        .labelColor(() => '#00ff00');

                    world.ringsData([{ lat: data.latitude, lng: data.longitude }])
                        .ringColor(() => '#00ff00');

                    world.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2 }, 2000);
                }
            } catch (e) {
                document.getElementById('info-painel').innerHTML = "ERRO NA LIGAÇÃO AO SATÉLITE";
            }
        }

        obterLocalizacao();

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });
    </script>
</body>
</html>
