<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v176 - CORE TRACER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .d-rau { width: 14px; height: 14px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.4s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(5); opacity: 0; } }
        #meta { font-size: 10px; color: #39ff14; margin-top: 10px; border-top: 1px solid #39ff1444; padding-top: 5px; }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 9px; letter-spacing: 5px; opacity: 0.7;">RAU SYSTEM v176</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px;">A TENTAR BYPASS DE REDE...</div>
    <div id="meta">SINAL: PROCURANDO HARDWARE</div>
</div>

<div id="globeViz"></div>

<script>
    const RAU_ID = 'CORE-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau"><span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    function deploy(lat, lng, city, method) {
        document.getElementById('status').innerText = city.toUpperCase();
        document.getElementById('meta').innerText = `MÉTODO: ${method} | LAT: ${lat.toFixed(3)}`;
        
        const geo = { lat, lng, city, clientId: RAU_ID };
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
        const channel = ably.channels.get('rau-live-radar');

        ably.connection.on('connected', () => {
            channel.presence.enter(geo);
            const sync = () => {
                channel.presence.get((err, members) => {
                    if (!err) {
                        const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                        document.getElementById('count').innerText = nodes.length;
                        world.htmlElementsData(nodes);
                    }
                });
            };
            channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
            sync();
        });
        world.pointOfView({ lat, lng, altitude: 1.5 }, 2000);
    }

    // O ÚNICO MÉTODO QUE NÃO USA O IP DA SEDE (ISP)
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                // Se o hardware responder, ele ignora o IP e faz Reverse Geocoding
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
                const data = await res.json();
                const city = (data.address.city || data.address.town || data.address.village || "LOCAL").toUpperCase();
                deploy(pos.coords.latitude, pos.coords.longitude, city, "HARDWARE-CORE");
            },
            async (err) => {
                // Se negares ou o hardware falhar, o IP vai mentir
                document.getElementById('status').innerText = "HARDWARE NEGADO. REDE VAI MENTIR.";
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                deploy(data.latitude, data.longitude, data.city.toUpperCase(), "ISP-DATABASE (UNRELIABLE)");
            },
            { enableHighAccuracy: true, timeout: 15000 }
        );
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
</script>
</body>
</html>
