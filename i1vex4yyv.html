<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; transition: background 1s; }
        #radar-box {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 30, 0, 0.85); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="radar-box">SISTEMA: A SINCRONIZAR HORÁRIO...</div>
    <div id="globeViz"></div>

    <script>
        // 1. Verificar se é dia ou noite (Entre as 07h e as 19h é DIA)
        const horaAtual = new Date().getHours();
        const eDia = horaAtual >= 7 && horaAtual < 19;

        // 2. Definir as texturas baseadas na hora
        const imgTerra = eDia 
            ? 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg' 
            : 'https://unpkg.com/three-globe/example/img/earth-night.jpg';
        
        const corFundo = eDia ? '#87CEEB' : '#000005'; // Azul céu ou Preto espacial

        document.body.style.background = corFundo;

        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl(imgTerra)
            .backgroundColor(corFundo)
            .showAtmosphere(true)
            .atmosphereColor('#00ff00')
            .atmosphereAltitude(0.15);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        async function iniciarRadar() {
            try {
                const response = await fetch('https://globorau.carlos2022yes.workers.dev/');
                const data = await response.json();
                
                const statusHora = eDia ? "MODO DIURNO" : "MODO NOTURNO";
                const local = `${data.flag} ${data.city}, ${data.country}`;
                
                document.getElementById('radar-box').innerHTML = `
                    ${statusHora}<br>
                    LOCALIZADO: ${local}
                `;

                const marker = [{ lat: data.latitude, lng: data.longitude }];
                
                world.ringsData(marker)
                    .ringColor(() => '#00ff00')
                    .ringMaxRadius(6)
                    .ringPropagationSpeed(2);

                world.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2 }, 2000);

            } catch (err) {
                document.getElementById('radar-box').innerHTML = "ERRO NA CONEXÃO";
            }
        }

        iniciarRadar();
    </script>
</body>
</html>
