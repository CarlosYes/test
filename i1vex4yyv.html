<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - XAT DESIGN</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial Black', sans-serif;
        }

        /* CONTAINER DO GLOBO (DESIGN FIEL AO LINK) */
        .world-box {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.3);
            border: 1px solid rgba(0, 150, 255, 0.2);
        }

        /* MAPA EM MOVIMENTO */
        .map-layer {
            position: absolute;
            width: 200%;
            height: 100%;
            background: url('https://carlosyes.github.io/rauglobe1/img/map.png') repeat-x;
            background-size: contain;
            animation: rotateMap 30s linear infinite;
            opacity: 0.8;
            z-index: 1;
        }

        /* EFEITO DE LUZ E PROFUNDIDADE (O QUE DÁ O DESIGN DO LINK) */
        .light-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, 
                        rgba(255, 255, 255, 0.15) 0%, 
                        transparent 50%, 
                        rgba(0, 0, 0, 0.9) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* HUD DE DADOS (USANDO TEU ESTILO DE FONTE E CORES) */
        .hud {
            position: absolute;
            bottom: 40px;
            text-align: center;
            color: #39ff14; /* Mantive o teu verde Neon no texto */
            z-index: 10;
            pointer-events: none;
        }

        .count {
            display: block;
            font-size: 80px;
            font-weight: 900;
            color: #fff;
            line-height: 0.8;
            letter-spacing: -5px;
            text-shadow: 0 0 25px rgba(57, 255, 20, 0.5);
        }

        .status-bar {
            font-size: 11px;
            margin-top: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 15px;
            border: 1px solid #39ff14;
            color: #fff;
        }

        @keyframes rotateMap {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Proteção Anti-Cópia */
        .secure-shield { position: absolute; width: 100%; height: 100%; z-index: 20; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="world-box">
        <div class="secure-shield"></div>
        <div class="map-layer"></div>
        <div class="light-overlay"></div>
    </div>

    <div class="hud">
        <div style="font-size: 10px; letter-spacing: 5px; color: #39ff14; margin-bottom: 5px;">RAU SYSTEM v92</div>
        <span id="count" class="count">0</span>
        <div id="status" class="status-bar">A FORÇAR RASTREIO REAL...</div>
    </div>

    <script>
        // CONFIGURAÇÕES TÉCNICAS DO TEU CÓDIGO
        const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
        const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

        // MOTOR DE PRECISÃO EXTREMA (TEU CÓDIGO ORIGINAL)
        async function getExtremeLoc() {
            try {
                const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
                const d = await response.json();
                
                if (d.latitude) {
                    const geo = {
                        lat: d.latitude,
                        lng: d.longitude,
                        city: (d.city || d.locality || "OSTEND").toUpperCase(),
                        country: d.countryCode.toLowerCase()
                    };
                    startSync(geo);
                }
            } catch (e) {
                document.getElementById('status').innerText = "ERRO DE SATÉLITE";
            }
        }

        function startSync(geo) {
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `FIXADO: ${geo.city}`;
                channel.presence.enter(geo);

                const update = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Atualiza o contador gigante na tela
                            document.getElementById('count').innerText = members.length;
                        }
                    });
                };
                
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], update);
                update();
            });
        }

        getExtremeLoc();

        // Bloqueio de teclas de inspeção
        document.onkeydown = (e) => {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'i' || e.key === 'j')) return false;
            if (e.key === 'F12') return false;
        };
    </script>
</body>
</html>
