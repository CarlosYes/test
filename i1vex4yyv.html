<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - Pormenor Absoluto</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { 
            width: 350px; background: #000; border-radius: 10px; border: 2px solid #f00; 
            box-shadow: 0 0 20px #f00; overflow: hidden; position: relative;
        }

        .title { font-size: 18px; text-align: center; font-weight: bold; color: #f00; padding: 10px; border-bottom: 1px solid #f00; }
        
        #canvas-container { width: 100%; height: 300px; background: #000; position: relative; }

        /* Etiquetas fixas ao ponto geográfico */
        .location-tag { 
            position: absolute; 
            pointer-events: none; 
            z-index: 10; 
            display: none; /* Inicialmente oculto até o cálculo entrar */
            flex-direction: column; 
            align-items: center; 
            transform: translate(-50%, -50%); 
        }
        .point { width: 8px; height: 8px; background: #0f0; border-radius: 50%; box-shadow: 0 0 10px #0f0; }
        .tag-info { background: rgba(0,0,0,0.8); border: 1px solid #0f0; padding: 2px 5px; border-radius: 3px; font-size: 10px; color: #0f0; margin-bottom: 4px; white-space: nowrap; }

        .footer { padding: 10px; border-top: 1px solid #f00; background: #000; }
        .info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        #time { font-size: 16px; font-weight: bold; color: #fff; }
        .vis-pill { background: #f00; padding: 2px 10px; border-radius: 15px; font-weight: bold; font-size: 14px; }

        .location-display-box { 
            height: 40px; 
            overflow: hidden; 
            position: relative; 
            background: rgba(255,0,0,0.1);
            border-radius: 5px;
        }
        
        .scroll-track { 
            display: flex; 
            flex-direction: column; 
            transition: transform 0.8s cubic-bezier(0.45, 0.05, 0.55, 0.95); 
        }

        .location-unit { 
            height: 40px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            text-transform: uppercase;
        }
        .location-unit img { width: 24px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">RAU RADAR</div>
    <div id="canvas-container"></div>
    <div class="footer">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">V: <span id="visNum">0</span></div>
        </div>
        
        <div class="location-display-box">
            <div class="scroll-track" id="scrollTrack">
                <div class="location-unit">A AGUARDAR...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 5);

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // OrbitControls para permitir rodar o globo sem bugar as etiquetas
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 2;
    controls.maxDistance = 5;

    const globe = new THREE.Group();
    scene.add(globe);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        })
    );
    globe.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    camera.position.z = 2.8;

    let markers = [];
    let currentIndex = 0;

    // Função precisa de conversão de coordenadas
    function latLngToVector3(lat, lng) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        const radius = 1;
        return new THREE.Vector3(
            -radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.sin(theta)
        );
    }

    function updateMarkers() {
        const widthHalf = container.clientWidth / 2;
        const heightHalf = container.clientHeight / 2;

        markers.forEach(m => {
            // Posição mundial considerando a rotação do globo
            const vector = m.vector.clone().applyMatrix4(globe.matrixWorld);
            
            // Verifica se o ponto está na face visível (frente) do globo
            const cameraDirection = new THREE.Vector3().subVectors(camera.position, globe.position).normalize();
            const dotValue = vector.dot(cameraDirection);

            if (dotValue > 0.3) { // Se estiver virado para a câmara
                vector.project(camera);
                m.tag.style.display = 'flex';
                m.tag.style.left = (vector.x * widthHalf + widthHalf) + 'px';
                m.tag.style.top = (-(vector.y * heightHalf) + heightHalf) + 'px';
            } else {
                m.tag.style.display = 'none';
            }
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        globe.rotation.y += 0.001; // Rotação lenta automática
        controls.update();
        updateMarkers();
        renderer.render(scene, camera);
    }
    animate();

    function startAutoScroll() {
        setInterval(() => {
            const track = document.getElementById('scrollTrack');
            const items = track.children.length;
            if (items > 1) {
                currentIndex = (currentIndex + 1) % items;
                track.style.transform = `translateY(-${currentIndex * 40}px)`;
            }
        }, 5000);
    }

    async function init() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myData = {
                id: SESSION_ID,
                city: d.city || "Lisboa",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude, lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-radar-v9');

            channel.presence.enter(myData);
            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    if (err) return;
                    document.getElementById('visNum').innerText = members.length;
                    
                    const track = document.getElementById('scrollTrack');
                    track.innerHTML = ""; 
                    
                    markers.forEach(m => m.tag.remove());
                    markers = [];

                    members.forEach(m => {
                        const u = m.data;
                        if (!u) return;

                        // Adiciona à lista de subida no rodapé
                        const unit = document.createElement('div');
                        unit.className = 'location-unit';
                        unit.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                        track.appendChild(unit);

                        // Cria a etiqueta 3D
                        const tag = document.createElement('div');
                        tag.className = 'location-tag';
                        tag.innerHTML = `<div class="tag-info">${u.city}</div><div class="point"></div>`;
                        container.appendChild(tag);
                        
                        markers.push({ 
                            tag, 
                            vector: latLngToVector3(u.lat, u.lng) 
                        });
                    });
                });
            });
        } catch (e) { console.error("Erro no Radar:", e); }
    }

    setInterval(() => {
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    }, 1000);

    init();
    startAutoScroll();
</script>
</body>
</html>
