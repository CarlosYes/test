<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v70 - BLACK OPS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; transition: background 1s; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        
        /* HUD v70 */
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 40px #39ff1444; border-radius: 2px;
        }
        .version-tag { font-size: 10px; letter-spacing: 5px; color: #39ff14; margin-bottom: 5px; opacity: 0.8; }
        .count-big { font-size: 90px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -6px; }
        
        /* ETIQUETAS GLOBAIS */
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 6px 14px; border-radius: 0px;
            font-size: 13px; font-weight: 900; display: flex; align-items: center; gap: 8px;
            white-space: nowrap; border: 1px solid #fff; box-shadow: 0 0 20px #39ff14;
        }
        .l-rau img { width: 22px; height: 15px; object-fit: cover; border: 1px solid #000; }
        
        /* PONTO DE IMPACTO */
        .d-rau { 
            width: 14px; height: 14px; background: #fff; border-radius: 50%; 
            margin-top: 6px; border: 3px solid #39ff14; 
            animation: pulse-v70 1.2s infinite ease-out; 
        }
        @keyframes pulse-v70 { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

<div class="hud">
    <div class="version-tag">RAU SYSTEM v70 [ULTIMATE]</div>
    <div id="user-count-hud" class="count-big">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace; border-top: 1px solid #39ff1444; pt-5">SCANNING...</div>
</div>

<div id="globeViz"></div>

<script>
    // 1. AMBIENTE DINÂMICO (20:41 = MODO NOITE)
    const hora = new Date().getHours();
    const eDia = hora >= 7 && hora < 19;
    const corFundo = eDia ? '#87CEEB' : '#000000';
    const imgTerra = eDia ? '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg' : '//unpkg.com/three-globe/example/img/earth-night.jpg';
    document.body.style.background = corFundo;

    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-V70-' + Math.random().toString(36).substr(2, 5);

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl(imgTerra)
        .backgroundColor(corFundo)
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flagUrl = `https://flagcdn.com/w40/${d.countryCode.toLowerCase()}.png`;
            el.innerHTML = `
                <div class="l-rau">
                    <img src="${flagUrl}">
                    <span>${d.city.toUpperCase()}</span>
                </div>
                <div class="d-rau"></div>`;
            return el;
        });

    // 2. MOTOR IMORTAL (JSONP)
    function launchSystem() {
        const script = document.createElement('script');
        script.src = 'https://ip-api.com/json/?callback=runV70';
        document.body.appendChild(script);
    }

    window.runV70 = function(d) {
        if (d.status === 'success') {
            const myLocation = { lat: d.lat, lng: d.lon, city: d.city, countryCode: d.countryCode };
            
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-v70-live');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `FIX: ${d.city.toUpperCase()} (ONLINE)`;
                channel.presence.enter(myLocation);

                const syncPresence = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const connections = members.map(m => m.data).filter(x => x && x.lat);
                            // Contador de visitas em tempo real no HUD
                            document.getElementById('user-count-hud').innerText = connections.length;
                            // Desenha todas as etiquetas ativas no globo
                            world.htmlElementsData(connections);
                        }
                    });
                };

                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], syncPresence);
                syncPresence();
            });

            world.pointOfView({ lat: d.lat, lng: d.lon, altitude: 2 }, 2000);
        }
    };

    window.onload = launchSystem;
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
</script>
</body>
</html>
