<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v152 - LATENCY PROBE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .d-rau { width: 14px; height: 14px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.6s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(3.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 10px; letter-spacing: 5px;">RAU SYSTEM v152</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace;">A TESTAR LATÊNCIA FÍSICA...</div>
</div>

<div id="globeViz"></div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 9);

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau"><span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function probe() {
        try {
            // Bypass total de bases de dados de IP
            // Usamos o motor de infraestrutura da Akamai/Cloudflare que deteta o PoP (Point of Presence)
            const response = await fetch('https://edns.ip-api.com/json');
            const dnsData = await response.json();
            
            // Segunda validação cruzada para precisão de hardware
            const res2 = await fetch('https://speed.cloudflare.com/meta');
            const cloudData = await res2.json();

            const geo = {
                lat: cloudData.latitude,
                lng: cloudData.longitude,
                city: (cloudData.city || "ORIGIN").toUpperCase(),
                clientId: SESSION_ID
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `RADAR FIXADO NO NÓ: ${geo.city}`;
                channel.presence.enter(geo);

                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // LIMPEZA ABSOLUTA: Filtra por ClientID para eliminar duplicados de Mechelen
                            const uniqueNodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = uniqueNodes.length;
                            world.htmlElementsData(uniqueNodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.8 }, 2000);
        } catch (e) {
            document.getElementById('status').innerText = "ERRO DE PROBE FÍSICO";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    probe();
</script>
</body>
</html>
