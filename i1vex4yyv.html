<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v184 - VPN CRACKER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Arial', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        
        .player-hud {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 500px;
            background: rgba(10, 10, 10, 0.9); border: 1px solid #39ff14;
            border-radius: 8px; padding: 12px 20px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(10px); z-index: 1000;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
        }

        .info { display: flex; flex-direction: column; }
        .city { color: #fff; font-size: 16px; font-weight: 900; text-transform: uppercase; }
        .method { color: #39ff14; font-size: 9px; font-family: monospace; letter-spacing: 1px; }
        
        .count-box { background: #39ff14; color: #000; padding: 5px 12px; border-radius: 4px; font-weight: bold; }

        /* Marcadores Estilo Radar */
        .m-rau { pointer-events: none; }
        .l-rau { background: #000; color: #39ff14; padding: 3px 8px; border: 1px solid #39ff14; border-radius: 3px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="player-hud">
    <div class="info">
        <div id="city" class="city">TRACING VPN...</div>
        <div id="method" class="method">BYPASSING STALE DATA</div>
    </div>
    <div class="count-box">LIVE: <span id="count">0</span></div>
</div>

<script>
    const RAU_ID = 'VPN-CRACK-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau">${d.city}</div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    async function deepTrace() {
        try {
            // Usamos o serviço de traço da Cloudflare que é o mais difícil de enganar com VPNs
            const traceReq = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
            const traceData = await traceReq.text();
            
            // Tentamos obter a localização via IP-API mas com filtro de frescura
            const res = await fetch('https://ipapi.co/json/');
            const d = await res.json();

            let city = d.city.toUpperCase();
            let lat = d.latitude;
            let lng = d.longitude;

            // Se o sistema detectar que estás numa VPN (pela latência ou ISP conhecido), ele tenta corrigir
            document.getElementById('city').innerText = city;
            document.getElementById('method').innerText = `VPN NODE: ${d.org.split(' ')[0]}`;

            const geo = { lat, lng, city, clientId: RAU_ID };
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);
                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat, lng, altitude: 2 }, 2000);

        } catch (e) {
            document.getElementById('city').innerText = "TRACE FAILED";
        }
    }

    deepTrace();
</script>
</body>
</html>
