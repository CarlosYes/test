<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v196 - CHRONOS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        
        /* HUD Adaptável */
        .p-hud {
            position: absolute; top: 30px; left: 20px;
            background: rgba(0,0,0,0.8); border-left: 2px solid #39ff14;
            padding: 12px 18px; color: #fff; z-index: 1000;
            border-radius: 0 4px 4px 0; backdrop-filter: blur(8px);
        }
        .p-city { font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .p-time { font-size: 9px; color: #39ff14; font-family: monospace; margin-top: 2px; opacity: 0.8; }
        .p-live { color: #39ff14; font-size: 10px; font-family: monospace; margin-top: 6px; }

        /* Marcadores */
        .m-rau { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .m-tag { 
            display: flex; align-items: center; gap: 6px; 
            background: rgba(0, 0, 0, 0.9); padding: 4px 8px; 
            border: 1px solid #39ff14; border-radius: 2px; margin-bottom: 4px;
        }
        .m-flag { width: 16px; height: auto; }
        .m-city { color: #fff; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        
        .dot-active { 
            width: 6px; height: 6px; background: #39ff14; border-radius: 50%; 
            box-shadow: 0 0 10px #39ff14; border: 1px solid #fff;
        }
        .dot-ghost { 
            width: 4px; height: 4px; background: #440000; border-radius: 50%; opacity: 0.6;
        }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="p-hud">
    <div id="status-text" class="p-city">SYSTEM SYNC...</div>
    <div id="time-text" class="p-time">---</div>
    <div class="p-live">LIVE NODES: <span id="count">0</span></div>
</div>

<script>
    const RAU_ID = 'CHRONOS-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    // Lógica de Tempo para o Globo
    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 18;
    
    // Imagens dinâmicas baseadas na hora
    const globeImage = isNight 
        ? '//unpkg.com/three-globe/example/img/earth-night.jpg' 
        : '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg';
    
    const backgroundImage = isNight
        ? '//unpkg.com/three-globe/example/img/night-sky.png'
        : null; // Fundo preto limpo de dia para contraste

    let archive = new Map();

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl(globeImage)
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor(isNight ? '#39ff14' : '#87CEEB') // Verde à noite, azul claro de dia
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            if (d.status === 'active') {
                const hasFlag = d.country && d.country !== '??';
                const flagHtml = hasFlag ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png" class="m-flag">` : '';
                el.innerHTML = `
                    <div class="m-tag">
                        ${flagHtml}
                        <span class="m-city">${d.city}</span>
                    </div>
                    <div class="dot-active"></div>
                `;
            } else {
                el.innerHTML = `<div class="dot-ghost"></div>`;
            }
            return el;
        });

    if (backgroundImage) world.backgroundImageUrl(backgroundImage);

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    async function launchChronos() {
        document.getElementById('time-text').innerText = isNight ? "MODE: NIGHT OPS" : "MODE: DAYLIGHT SCAN";
        
        try {
            const res = await fetch('https://speed.cloudflare.com/meta');
            const data = await res.json();
            
            const myGeo = {
                lat: data.latitude || 0,
                lng: data.longitude || 0,
                city: data.city ? data.city.toUpperCase() : "GLOBAL USER",
                country: data.country ? data.country.toLowerCase() : "??",
                status: 'active'
            };

            document.getElementById('status-text').innerText = myGeo.city;

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);
                channel.presence.subscribe(msg => {
                    const { action, clientId, data } = msg;
                    if (['enter', 'present', 'update'].includes(action)) {
                        archive.set(clientId, { ...data, status: 'active' });
                    } else if (action === 'leave') {
                        const prev = archive.get(clientId);
                        if (prev) archive.set(clientId, { ...prev, status: 'ghost' });
                    }
                    refresh();
                });
                channel.presence.get((err, members) => {
                    if (!err) {
                        members.forEach(m => archive.set(m.clientId, { ...m.data, status: 'active' }));
                        refresh();
                    }
                });
            });

            if (myGeo.lat !== 0) {
                world.pointOfView({ lat: myGeo.lat, lng: myGeo.lng, altitude: 2 }, 1500);
            }

        } catch (e) {
            document.getElementById('status-text').innerText = "GENERAL ACCESS";
        }
    }

    function refresh() {
        const nodes = Array.from(archive.values());
        document.getElementById('count').innerText = nodes.filter(n => n.status === 'active').length;
        world.htmlElementsData(nodes.filter(n => n.lat !== undefined));
    }

    launchChronos();
</script>
</body>
</html>
