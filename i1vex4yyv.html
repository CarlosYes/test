<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v82 - FINAL CORE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #87CEEB; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 40px rgba(57, 255, 20, 0.5);
        }
        .v-tag { font-size: 10px; letter-spacing: 5px; color: #39ff14; margin-bottom: 5px; }
        .count-big { font-size: 110px; font-weight: 900; color: #fff; line-height: 0.7; letter-spacing: -8px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 6px 14px; 
            font-size: 14px; font-weight: 900; display: flex; align-items: center; gap: 8px;
            border: 2px solid #fff; box-shadow: 0 0 20px #39ff14; white-space: nowrap;
        }
        .l-rau img { width: 22px; height: 15px; object-fit: cover; border: 1px solid #000; }
        .d-rau { 
            width: 14px; height: 14px; background: #fff; border-radius: 50%; 
            margin-top: 6px; border: 3px solid #39ff14; 
            animation: pulse-v82 1.2s infinite ease-out; 
        }
        @keyframes pulse-v82 { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(4); opacity: 0; } }
    </style>
</head>
<body>

<div class="hud">
    <div class="v-tag">RAU SYSTEM v82</div>
    <div id="user-count-hud" class="count-big">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 15px; font-family: monospace; border-top: 2px solid #39ff14; padding-top: 8px;">A RASTREAR LOCALIZAÇÃO...</div>
</div>

<div id="globeViz"></div>

<script>
    // 1. CONFIGURAÇÕES FIXAS
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-V82-' + Math.random().toString(36).substr(2, 5);

    // 2. O MOTOR QUE MANDA EM TUDO
    window.renderSystem = function(data) {
        if (data.status !== 'success') {
            document.getElementById('status').innerText = "ERRO: FALHA NO SATÉLITE";
            return;
        }

        document.getElementById('status').innerText = `FIX: ${data.city.toUpperCase()}`;

        // Desenha o Globo apenas após ter os dados
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('//unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('#87CEEB')
            .showAtmosphere(true)
            .atmosphereColor('#39ff14')
            .htmlElement(d => {
                const el = document.createElement('div');
                el.className = 'm-rau';
                const flagUrl = `https://flagcdn.com/w40/${d.countryCode.toLowerCase()}.png`;
                el.innerHTML = `<div class="l-rau"><img src="${flagUrl}"><span>${d.city.toUpperCase()}</span></div><div class="d-rau"></div>`;
                return el;
            });

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;
        world.pointOfView({ lat: data.lat, lng: data.lon, altitude: 2 }, 2000);

        // Conecta ao Ably
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('rau-v82-live');
        const myLoc = { lat: data.lat, lng: data.lon, city: data.city, countryCode: data.countryCode };

        ably.connection.on('connected', () => {
            channel.presence.enter(myLoc);
            const sync = () => {
                channel.presence.get((err, members) => {
                    if (!err) {
                        const activeUsers = members.map(m => m.data).filter(x => x && x.lat);
                        document.getElementById('user-count-hud').innerText = activeUsers.length;
                        world.htmlElementsData(activeUsers);
                    }
                });
            };
            channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
            sync();
        });
    };

    // 3. DISPARO ÚNICO E FORÇADO
    const apiScript = document.createElement('script');
    apiScript.src = 'https://ip-api.com/json/?callback=renderSystem&t=' + Date.now();
    document.body.appendChild(apiScript);
</script>
</body>
</html>
