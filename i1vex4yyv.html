<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - SINGLE FOCUS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { 
            width: 100%; max-width: 420px; 
            background: rgba(10, 0, 0, 0.98); 
            border-radius: 15px; border: 2.5px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 20px; text-align: center; font-weight: bold; color: #ff4444; padding: 10px; letter-spacing: 2px; border-bottom: 1.5px solid rgba(255,0,0,0.3); }
        
        #canvas-container { width: 100%; height: 320px; background: #000; position: relative; cursor: grab; }

        /* --- JANELA DE FOCO ÚNICO (MOSTRA APENAS 1 CIDADE) --- */
        .location-window {
            height: 50px; /* Altura exata para caber apenas UM item com margem */
            background: rgba(20, 0, 0, 0.6); 
            border-top: 1px solid #500;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .location-scroll-track {
            display: flex;
            flex-direction: column;
            width: 100%;
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        .location-item { 
            height: 50px; /* Mesma altura da janela */
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 15px;
            font-size: 13px; 
            text-transform: uppercase; 
            font-weight: 900;
            color: #fff;
            flex-shrink: 0;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        .location-item img { width: 24px; border: 1px solid rgba(255,255,255,0.2); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00ff00; box-shadow: 0 0 8px #00ff00; }

        /* ETIQUETAS NO GLOBO */
        .location-tag { position: absolute; pointer-events: none; z-index: 100; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); }
        .user-point-mini { width: 6px; height: 6px; background: #00ff00; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 10px #00ff00; }
        .tag-info { margin-bottom: 6px; background: rgba(0,0,0,0.9); border: 1px solid #0f0; padding: 2px 6px; border-radius: 3px; font-size: 9px; font-weight: bold; color: #0f0; white-space: nowrap; }

        /* HEADER INFOS */
        .header { padding: 10px; background: rgba(150, 0, 0, 0.15); border-top: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 25px; }
        #time { font-size: 20px; font-weight: bold; font-family: monospace; color: #ffcccc; }
        .vis-pill { background: #ff0000; padding: 2px 12px; border-radius: 20px; font-size: 16px; font-weight: 900; border: 2px solid #fff; }
        #date { font-size: 10px; margin-top: 4px; color: #ffaaaa; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-container"></div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-window">
        <div class="location-scroll-track" id="locationData">
            <div class="location-item">A SINCRONIZAR...</div>
        </div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            shininess: 15 
        })
    );
    globe.rotation.y = -Math.PI / 2; // Correção Geográfica
    scene.add(globe);

    camera.position.set(2, 0.8, 2); 
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    let markers = [];
    let historyUsers = new Map();
    let scrollIndex = 0;

    function latLngToVector3(lat, lng) {
        const radius = 1.005;
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(
            -radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.sin(theta)
        );
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!controls.active) globe.rotation.y += 0.0015;

        markers.forEach(m => {
            const worldPos = m.vector.clone().applyMatrix4(globe.matrixWorld);
            const screenPos = worldPos.clone().project(camera);
            const isVisible = worldPos.angleTo(camera.position) < Math.PI / 2.05;

            if (isVisible) {
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(screenPos.x * 0.5 + 0.5) * container.clientWidth}px`;
                m.tag.style.top = `${(screenPos.y * -0.5 + 0.5) * container.clientHeight}px`;
                const dist = camera.position.distanceTo(worldPos);
                m.tag.style.transform = `translate(-50%, -50%) scale(${Math.max(0.6, 1.8/dist)})`;
            } else {
                m.tag.style.display = 'none';
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // LÓGICA DE SALTO DE 5 SEGUNDOS (FOCO ÚNICO)
    setInterval(() => {
        const track = document.getElementById("locationData");
        const items = track.children;
        if (items.length > 1) {
            scrollIndex++;
            if (scrollIndex >= items.length) scrollIndex = 0;
            track.style.transform = `translateY(-${scrollIndex * 50}px)`; // Salto exato de 50px
        }
    }, 5000);

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myGeo = {
                id: SESSION_ID, city: (d.city || "LISBOA").toUpperCase(),
                country: d.countryName, code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude, lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);
                channel.presence.subscribe(() => {
                    channel.presence.get((err, members) => {
                        if (err) return;
                        document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                        
                        historyUsers.forEach(u => u.online = false);
                        members.forEach(m => { if(m.data) historyUsers.set(m.data.id, { ...m.data, online: true }); });

                        markers.forEach(m => m.tag.remove());
                        markers = [];
                        const track = document.getElementById("locationData");
                        track.innerHTML = "";

                        Array.from(historyUsers.values()).reverse().forEach(u => {
                            if(u.online) {
                                // Item na lista inferior
                                const item = document.createElement("div");
                                item.className = "location-item";
                                item.innerHTML = `<span class="status-dot"></span> <img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                                track.appendChild(item);

                                // Ponto no Globo
                                const tag = document.createElement('div');
                                tag.className = 'location-tag';
                                tag.innerHTML = `<div class="tag-info">${u.city}</div><div class="user-point-mini"></div>`;
                                container.appendChild(tag);
                                markers.push({ tag, vector: latLngToVector3(u.lat, u.lng) });
                            }
                        });
                    });
                });
            });
        } catch(e) { console.error(e); }
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);

    initRadar();
</script>
</body>
</html>
