<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - EXTREME PRECISION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 5px; overflow: hidden; }
        
        .container { 
            width: 440px; background: #000; border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7); display: flex; flex-direction: column; position: relative;
        }

        .title { font-size: 22px; text-align: center; font-weight: 900; color: #ff0000; padding: 12px; text-shadow: 0 0 10px #ff0000; letter-spacing: 3px; }
        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 12px 20px; background: rgba(150, 0, 0, 0.2); 
            border-top: 1px solid #ff0000; border-bottom: 1px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
        }
        .live-indicator { font-size: 20px; font-weight: 900; color: #39ff14; text-shadow: 0 0 10px #39ff14; }
        #time { font-size: 20px; font-weight: bold; color: #fff; font-family: monospace; }

        /* Estilo das etiquetas que pediste no Extreme */
        .globe-label {
            display: flex; flex-direction: column; align-items: center;
            backface-visibility: hidden;
        }
        .label-box {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .label-box img { width: 20px; height: 13px; object-fit: cover; }
        .dot-marker { 
            width: 12px; height: 12px; background: #fff; border-radius: 50%; 
            margin-top: 5px; border: 2px solid #39ff14; 
            animation: pulse 0.6s infinite alternate; 
        }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(2.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR v92 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">00</span></div>
        <span id="time">00:00:00</span>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // Globo Original Azul Noite
    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-night.jpg') 
        })
    );
    globeGroup.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));

    // FOCO OBRIGATÓRIO: ARÁBIA SAUDITA
    camera.position.set(1.5, 0.8, 2.2); 
    camera.lookAt(0, 0, 0);

    let activeMarkers = new Map();

    async function startExtremeService() {
        try {
            // MOTOR DE PRECISÃO EXTREMA (O que pediste agora)
            const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
            const d = await response.json();
            
            const geo = {
                lat: d.latitude,
                lng: d.longitude,
                city: (d.city || d.locality || "S/N").toUpperCase(),
                country: (d.countryCode || "PT").toLowerCase()
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'RAU-' + Math.random().toString(36).substr(2, 5) });
            const channel = ably.channels.get('rau-extreme-sync');
            
            channel.presence.enter(geo);

            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    if (err) return;
                    document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                    activeMarkers.forEach(m => scene.remove(m.label));
                    activeMarkers.clear();

                    members.forEach(m => {
                        const u = m.data; if(!u || !u.lat) return;
                        const div = document.createElement('div');
                        div.className = 'globe-label';
                        div.innerHTML = `
                            <div class="label-box">
                                <img src="https://flagcdn.com/w40/${u.country}.png">
                                <span>${u.city}</span>
                            </div>
                            <div class="dot-marker"></div>`;
                        
                        const label = new THREE.CSS3DSprite(div);
                        label.scale.set(0.0025, 0.0025, 0.0025);
                        scene.add(label);
                        activeMarkers.set(m.clientId, {label, lat: u.lat, lng: u.lng});
                    });
                });
            });
        } catch (e) { console.log("Erro de rastreio"); }
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.003; 
        
        activeMarkers.forEach(m => {
            const phi = (90 - m.lat) * (Math.PI / 180);
            const theta = (m.lng + 180) * (Math.PI / 180) + globeGroup.rotation.y;
            m.label.position.set(-1.08 * Math.sin(phi) * Math.cos(theta), 1.08 * Math.cos(phi), 1.08 * Math.sin(phi) * Math.sin(theta));
        });

        renderer.render(scene, camera);
        css3dRenderer.render(scene, camera);
    }

    setInterval(() => { 
        document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); 
    }, 1000);

    startExtremeService();
    animate();
</script>
</body>
</html>
