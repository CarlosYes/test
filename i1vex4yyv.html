<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; transition: background 1s; }
        #radar-box {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 30, 0, 0.9); color: #00ff00;
            padding: 18px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 20px; font-weight: bold;
            box-shadow: 0 0 20px #00ff00; border-radius: 8px;
        }
    </style>
</head>
<body>
    <div id="radar-box">SISTEMA: A SOLICITAR GPS...</div>
    <div id="globeViz"></div>

    <script>
        const hora = new Date().getHours();
        const eDia = hora >= 7 && hora < 19;
        const corFundo = eDia ? '#87CEEB' : '#000000';
        const imgTerra = eDia ? 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg' : 'https://unpkg.com/three-globe/example/img/earth-night.jpg';

        document.body.style.background = corFundo;

        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl(imgTerra)
            .backgroundColor(corFundo)
            .showAtmosphere(true)
            .atmosphereColor('#00ff00');

        world.controls().autoRotate = true;

        async function localizar() {
            // Tentar GPS do Navegador para precisão real
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(async (pos) => {
                    // Se o utilizador aceitar o GPS:
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    
                    // Usamos o Worker apenas para traduzir as coordenadas em Nome de Cidade/Bandeira
                    try {
                        const res = await fetch(`https://globorau.carlos2022yes.workers.dev/`);
                        const data = await res.json();
                        atualizarGlobo(lat, lng, data.city, data.flag);
                    } catch {
                        atualizarGlobo(lat, lng, "Localização Real", "📍");
                    }
                }, async () => {
                    // Se o utilizador recusar o GPS, volta ao IP (Mechelen)
                    const res = await fetch('https://globorau.carlos2022yes.workers.dev/');
                    const data = await res.json();
                    atualizarGlobo(data.latitude, data.longitude, data.city, data.flag);
                });
            }
        }

        function atualizarGlobo(lat, lng, cidade, bandeira) {
            document.getElementById('radar-box').innerHTML = `
                SISTEMA RADAR ATIVO<br>
                ------------------<br>
                LOCAL: ${bandeira} ${cidade.toUpperCase()}<br>
                MODO: ${eDia ? 'DIURNO' : 'NOTURNO'}
            `;
            world.ringsData([{ lat, lng }]).ringColor(() => '#00ff00');
            world.pointOfView({ lat, lng, altitude: 1.8 }, 2000);
        }

        localizar();
    </script>
</body>
</html>
