<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v93 - CLOUDFLARE EDGE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial Black', sans-serif; }
        body { padding: 5px; display: flex; justify-content: center; overflow: hidden; user-select: none; background: #000; }
        
        .container { 
            width: 440px; border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7); overflow: hidden; position: relative;
            display: flex; flex-direction: column; background: #000;
        }

        .title { font-size: 22px; text-align: center; font-weight: 900; color: #ff0000; padding: 12px; text-shadow: 0 0 10px #ff0000; letter-spacing: 3px; }
        #canvas-globe { width: 100%; height: 320px; position: relative; cursor: grab; }

        .header { 
            padding: 12px 20px; background: rgba(150, 0, 0, 0.3); 
            border-top: 1px solid #ff0000; display: flex; justify-content: space-between; align-items: center; 
        }
        #time { font-size: 20px; font-weight: 900; color: #fff; }
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #fff; border: 1px solid #fff; }

        /* Etiquetas Neon Verdes */
        .location-tag { position: absolute; pointer-events: none; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -100%); }
        .tag-box {
            background: #39ff14; color: #000; padding: 3px 8px; border-radius: 3px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 5px;
            border: 1px solid #fff; white-space: nowrap; box-shadow: 0 0 10px #39ff14;
        }
        .tag-box img { width: 18px; height: 12px; object-fit: cover; }
        .dot-green { width: 10px; height: 10px; background: #fff; border-radius: 50%; border: 2px solid #39ff14; margin-top: 2px; box-shadow: 0 0 10px #39ff14; }

        .location-list { max-height: 150px; overflow-y: auto; padding: 10px; background: #050000; border-top: 1px solid #300; }
        .location-item { 
            padding: 8px; background: rgba(255,0,0,0.1); border-left: 4px solid #f00; 
            border-radius: 4px; display: flex; align-items: center; gap: 10px; 
            margin-bottom: 5px; font-size: 12px; color: #fff; text-transform: uppercase; font-weight: bold; 
        }
        .location-item img { width: 22px; }
    </style>
</head>
<body oncontextmenu="return false">

<div class="container">
    <div class="title">🎧 RAU RADAR v93 🎶</div>
    <div id="canvas-globe"></div>
    <div class="header">
        <span id="time">00:00:00</span>
        <div class="vis-pill">👥 <span id="visNum">00</span></div>
    </div>
    <div class="location-list" id="locationData"></div>
</div>

<script>
    // 1. CONFIGURAÇÃO DO GLOBO (THREE.JS)
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // Textura noturna para realçar os pontos neon
    const imgTerra = 'https://unpkg.com/three-globe/example/img/earth-night.jpg';
    const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ map: new THREE.TextureLoader().load(imgTerra) })
    );
    globeGroup.add(globe);
    scene.add(new THREE.AmbientLight(0xffffff, 1.6));

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = false;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 0.5;

    // FOCO INICIAL: ARÁBIA SAUDITA (Lat: 23.8, Lon: 45.0)
    const phi = (90 - 23.8) * (Math.PI / 180);
    const theta = (45.0 + 180) * (Math.PI / 180);
    camera.position.set(
        -2.5 * Math.sin(phi) * Math.cos(theta),
        2.5 * Math.cos(phi),
        2.5 * Math.sin(phi) * Math.sin(theta)
    );
    controls.update();

    // 2. LOGICA ABLY E LOCALIZAÇÃO (VIA WORKER)
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);
    let markers = [];

    async function startAbly() {
        let myProfile = { city: "RAU USER", code: "pt", lat: 38.7, lng: -9.1 };

        try {
            // No Cloudflare Worker, este fetch para /cdn-cgi/trace ou um endpoint seu 
            // que retorne JSON da request.cf é instantâneo e ilimitado.
            const response = await fetch("https://ipapi.co/json/"); // Fallback se o worker não injetar dados
            const d = await response.json();
            if(d.latitude) {
                myProfile = { 
                    city: (d.city || "RAU").toUpperCase(), 
                    code: (d.country_code || "pt").toLowerCase(), 
                    lat: d.latitude, 
                    lng: d.longitude 
                };
            }
        } catch(e) { console.warn("Usando perfil padrão"); }

        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('rau-final-live');
        
        channel.presence.enter(myProfile);

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                const list = document.getElementById("locationData");
                list.innerHTML = "";
                markers.forEach(m => { globeGroup.remove(m.dot); m.tag.remove(); });
                markers = [];

                members.forEach(m => {
                    const u = m.data; if(!u || !u.lat) return;
                    
                    // Lista Lateral
                    const item = document.createElement("div");
                    item.className = "location-item";
                    item.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                    list.appendChild(item);

                    // Ponto 3D no Globo
                    const pPhi = (90 - u.lat) * (Math.PI / 180);
                    const pTheta = (u.lng + 180) * (Math.PI / 180);
                    const pos = new THREE.Vector3(
                        -1.03 * Math.sin(pPhi) * Math.cos(pTheta), 
                        1.03 * Math.cos(pPhi), 
                        1.03 * Math.sin(pPhi) * Math.sin(pTheta)
                    );
                    
                    const dot = new THREE.Mesh(
                        new THREE.SphereGeometry(0.02, 12, 12), 
                        new THREE.MeshBasicMaterial({ color: 0x39ff14 })
                    );
                    dot.position.copy(pos);
                    globeGroup.add(dot);

                    // Etiqueta Neon
                    const tag = document.createElement('div');
                    tag.className = 'location-tag';
                    tag.innerHTML = `
                        <div class="tag-box">
                            <img src="https://flagcdn.com/w20/${u.code}.png">
                            <span>${u.city}</span>
                        </div>
                        <div class="dot-green"></div>
                    `;
                    document.getElementById('canvas-globe').appendChild(tag);
                    markers.push({ dot, tag, pos });
                });
                document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
            });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        
        markers.forEach(m => {
            const v = m.pos.clone().applyQuaternion(globeGroup.quaternion).project(camera);
            const dotDir = m.pos.clone().applyQuaternion(globeGroup.quaternion).normalize();
            const camDir = camera.position.clone().normalize();
            const isVisible = dotDir.dot(camDir) > 0; // Oculta se estiver atrás do globo

            if(isVisible && v.z < 1) {
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(v.x * 0.5 + 0.5) * 440}px`;
                m.tag.style.top = `${(v.y * -0.5 + 0.5) * 320}px`;
            } else { 
                m.tag.style.display = 'none'; 
            }
        });
        renderer.render(scene, camera);
    }

    setInterval(() => { 
        document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT'); 
    }, 1000);

    startAbly(); animate();
</script>
</body>
</html>
