<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - PRECISÃO TOTAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; color: #fff; padding: 5px; display: flex; justify-content: center; }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(15, 0, 0, 0.98); 
            border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; }
        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; cursor: grab; }

        .header { padding: 12px; background: rgba(120, 0, 0, 0.3); border-bottom: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; }
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #fff; border: 1px solid #fff; min-width: 60px; text-align: center; }

        .location-list-wrapper { height: 50px; overflow: hidden; background: #050000; border-top: 1px solid #300; }
        .location-list { display: flex; flex-direction: column; transition: transform 0.8s ease-in-out; }
        .location-item { height: 50px; padding: 0 15px; background: rgba(255,0,0,0.1); border-left: 4px solid #f00; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; text-transform: uppercase; font-weight: bold; flex-shrink: 0; }
        .location-item img { width: 25px; border-radius: 2px; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"></div>
    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date" style="font-size: 12px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase;"></div>
    </div>
    <div class="location-list-wrapper">
        <div class="location-list" id="locationData"></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 5);

    const container = document.getElementById('canvas-globe');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') })
    );
    globeGroup.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    
    // FOCO INICIAL: Arábia Saudita
    camera.position.set(2.4, 1.0, 2.2); 
    camera.lookAt(0, 0, 0);

    let markers = [];
    let currentIndex = 0;

    function latLngToVec(lat, lng) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(-1.01 * Math.sin(phi) * Math.cos(theta), 1.01 * Math.cos(phi), 1.01 * Math.sin(phi) * Math.sin(theta));
    }

    // Criar uma etiqueta 3D (Sprite) que funde bolinha, texto e bandeira
    function createMarkerSprite(city, code) {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 64;
        const ctx = canvas.getContext('2d');

        // Bolinha verde minúscula
        ctx.fillStyle = '#00ff00';
        ctx.beginPath();
        ctx.arc(12, 32, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 10; ctx.shadowColor = "#00ff00"; ctx.fill();

        // Texto da Cidade
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px Segoe UI';
        ctx.fillText(city.toUpperCase(), 25, 40);

        const texture = new THREE.CanvasTexture(canvas);
        const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
        const sprite = new THREE.Sprite(spriteMat);
        sprite.scale.set(0.6, 0.15, 1);
        return sprite;
    }

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myData = { id: SESSION_ID, city: d.city || "Local", code: (d.countryCode || "pt").toLowerCase(), lat: d.latitude, lng: d.longitude };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-radar-v9');

            channel.presence.enter(myData);
            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    if (err) return;
                    document.getElementById('visNum').innerText = members.length < 10 ? "0" + members.length : members.length;
                    const list = document.getElementById("locationData");
                    list.innerHTML = "";
                    
                    markers.forEach(m => globeGroup.remove(m));
                    markers = [];

                    members.forEach(m => {
                        const u = m.data; if (!u) return;

                        // Rodapé
                        const div = document.createElement("div");
                        div.className = "location-item";
                        div.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                        list.appendChild(div);

                        // Marcador de Precisão no Globo
                        const pos = latLngToVec(u.lat, u.lng);
                        const marker = createMarkerSprite(u.city, u.code);
                        marker.position.copy(pos);
                        globeGroup.add(marker);
                        markers.push(marker);
                    });
                });
            });
        } catch (e) { console.error(e); }
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.0015;
        controls.update();
        renderer.render(scene, camera);
    }

    setInterval(() => {
        const track = document.getElementById('locationData');
        if (track.children.length > 1) {
            currentIndex = (currentIndex + 1) % track.children.length;
            track.style.transform = `translateY(-${currentIndex * 50}px)`;
        }
    }, 5000);

    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);

    initRadar();
    animate();
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
