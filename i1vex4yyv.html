<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - STATUS EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(10, 0, 0, 0.98); 
            border-radius: 15px; border: 2.5px solid #ff0000; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.7); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; border-bottom: 2px solid rgba(255,0,0,0.3); }
        
        #canvas-container { width: 100%; height: 350px; background: #000; position: relative; cursor: grab; overflow: hidden; }

        /* STATUS DOTS */
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 5px currentColor; }
        .online { background-color: #00ff00; color: #00ff00; }
        .offline { background-color: #660000; color: #660000; }

        .location-tag {
            position: absolute; color: #fff; font-size: 10px; font-weight: bold;
            text-transform: uppercase; pointer-events: none; display: flex;
            align-items: center; gap: 5px; white-space: nowrap;
            text-shadow: 2px 2px 4px #000; background: rgba(20, 0, 0, 0.85);
            padding: 3px 8px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); z-index: 100;
            transform: translate(-50%, -50%);
        }
        .location-tag img { width: 16px; border-radius: 1px; }

        .header { padding: 12px; background: rgba(150, 0, 0, 0.25); border-top: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; font-family: 'Courier New', monospace; }
        .vis-pill { background: #ff0000; padding: 5px 18px; border-radius: 20px; font-size: 22px; font-weight: 900; color: #fff; border: 2px solid #fff; min-width: 80px; text-align: center; }

        .location-list { max-height: 150px; overflow-y: auto; padding: 12px; background: #080000; border-top: 2px solid #400; }
        .location-item { padding: 8px; background: rgba(255,0,0,0.08); border-left: 5px solid #f00; border-radius: 4px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .location-item img { width: 20px; height: 13px; }

        #date { font-size: 11px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase; }
        .location-list::-webkit-scrollbar { width: 6px; }
        .location-list::-webkit-scrollbar-thumb { background: #f00; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-container"></div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    // --- THREE.JS SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 1.8;
    controls.maxDistance = 5.0;

    const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            shininess: 15
        })
    );
    scene.add(globe);

    // Início na Arábia Saudita
    globe.rotation.y = -Math.PI / 1.5; 
    camera.position.set(0, 0.8, 2.8); 
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    let markers = [];
    let historyUsers = new Map(); // Para guardar quem saiu

    function latLngToVector3(lat, lng) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(-Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!controls.active) globe.rotation.y += 0.002;
        
        markers.forEach(m => {
            const pos = m.vector.clone().applyQuaternion(globe.quaternion);
            const vector = pos.clone().project(camera);
            const isVisible = pos.angleTo(camera.position) < Math.PI/2.1;
            
            if(isVisible) {
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(vector.x * 0.5 + 0.5) * container.clientWidth}px`;
                m.tag.style.top = `${(vector.y * -0.5 + 0.5) * container.clientHeight}px`;
            } else {
                m.tag.style.display = 'none';
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myGeo = {
                id: SESSION_ID,
                city: (d.city || d.locality || "GPS").toUpperCase(),
                country: d.countryName || "Mundo",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude,
                lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);

                // Escutar atualizações de presença
                channel.presence.subscribe(() => {
                    channel.presence.get((err, members) => {
                        if (err) return;

                        // 1. Atualizar Contador de ONLINE agora
                        document.getElementById('visNum').innerText = members.length < 10 ? "0" + members.length : members.length;

                        // 2. Atualizar mapa de histórico
                        // Primeiro, marcamos todos no histórico como OFFLINE (bolinha escura)
                        historyUsers.forEach(u => u.online = false);

                        // Depois, marcamos os que estão presentes como ONLINE (bolinha verde)
                        members.forEach(m => {
                            const u = m.data;
                            if(u && u.id) {
                                historyUsers.set(u.id, { ...u, online: true });
                            }
                        });

                        // 3. Limpar Tags e Lista Visual
                        markers.forEach(m => m.tag.remove());
                        markers = [];
                        const list = document.getElementById("locationData");
                        list.innerHTML = "";

                        // 4. Renderizar do mais recente para o mais antigo
                        const sortedUsers = Array.from(historyUsers.values()).reverse();

                        sortedUsers.forEach(u => {
                            const statusClass = u.online ? 'online' : 'offline';
                            
                            // Adicionar na lista inferior
                            const item = document.createElement("div");
                            item.className = "location-item";
                            item.innerHTML = `
                                <span class="status-dot ${statusClass}"></span>
                                <img src="https://flagcdn.com/w40/${u.code}.png"> 
                                <span>${u.city} - ${u.country}</span>
                            `;
                            list.appendChild(item);

                            // Só colocamos tag no GLOBO se estiver ONLINE
                            if(u.online) {
                                const tag = document.createElement('div');
                                tag.className = 'location-tag';
                                tag.innerHTML = `<span class="status-dot online"></span><img src="https://flagcdn.com/w20/${u.code}.png"> ${u.city}`;
                                container.appendChild(tag);
                                markers.push({ tag, vector: latLngToVector3(u.lat, u.lng) });
                            }
                        });
                    });
                });
            });
        } catch(e) { console.error(e); }
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);

    initRadar();
</script>
</body>
</html>
