<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR 2026 - DEFINITIVO</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
        
        .container { 
            width: 440px; background: #000; border-radius: 20px; border: 3px solid #ff0000; 
            box-shadow: 0 0 50px #ff0000; display: flex; flex-direction: column; position: relative;
        }

        .title { font-size: 26px; text-align: center; font-weight: 900; color: #ff0000; padding: 15px; text-shadow: 0 0 15px #ff0000; letter-spacing: 5px; }
        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 15px 20px; background: rgba(255, 0, 0, 0.15); 
            border-top: 2px solid #ff0000; border-bottom: 2px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
        }
        .live-indicator { font-size: 22px; font-weight: 900; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        #time { font-size: 22px; font-weight: bold; color: #fff; font-family: monospace; }

        .globe-label {
            display: flex; align-items: center; gap: 10px; padding: 12px 24px;
            background: rgba(0, 0, 0, 0.9); border-radius: 40px; border: 2px solid #ff0000;
            box-shadow: 0 0 30px #ff0000; backface-visibility: hidden;
        }
        .globe-label span {
            color: #ff0000; font-weight: 900; font-size: 28px; text-transform: uppercase;
            text-shadow: 0 0 20px #ff0000; white-space: nowrap;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">--</span></div>
        <span id="time">00:00:00</span>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 440/320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    // GLOBO REAL DE GRADE (IMPOSSÍVEL FUGIR)
    const globeGroup = new THREE.Group();
    const geometry = new THREE.SphereGeometry(1, 32, 32);
    const material = new THREE.MeshBasicMaterial({ color: 0x330000, wireframe: true, transparent: true, opacity: 0.3 });
    const globe = new THREE.Mesh(geometry, material);
    globeGroup.add(globe);
    
    // Núcleo sólido para dar corpo ao globo
    const core = new THREE.Mesh(new THREE.SphereGeometry(0.98, 32, 32), new THREE.MeshBasicMaterial({color: 0x050000}));
    globeGroup.add(core);
    scene.add(globeGroup);

    camera.position.z = 2.5;

    let activeMarkers = new Map();

    async function initRadar() {
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'RAU-' + Math.random() });
        const channel = ably.channels.get('radar-v100-final');
        
        channel.presence.enter({ city: "SINGAPORE", lat: 1.35, lng: 103.8 });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                
                activeMarkers.forEach(m => scene.remove(m.label));
                activeMarkers.clear();

                members.forEach(m => {
                    const u = m.data;
                    const div = document.createElement('div');
                    div.className = 'globe-label';
                    div.innerHTML = `<div style="width:15px;height:15px;background:#00ff00;border-radius:50%;box-shadow:0 0 15px #00ff00"></div><span>${u.city}</span>`;
                    const label = new THREE.CSS3DSprite(div);
                    label.scale.set(0.002, 0.002, 0.002);
                    scene.add(label);
                    activeMarkers.set(m.clientId, {label, lat: u.lat, lng: u.lng});
                });
            });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.008;
        
        activeMarkers.forEach(m => {
            const phi = (90 - m.lat) * (Math.PI / 180);
            const theta = (m.lng + 180) * (Math.PI / 180) + globeGroup.rotation.y;
            m.label.position.set(-1.1 * Math.sin(phi) * Math.cos(theta), 1.1 * Math.cos(phi), 1.1 * Math.sin(phi) * Math.sin(theta));
        });

        renderer.render(scene, camera);
        css3dRenderer.render(scene, camera);
    }

    setInterval(() => { document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); }, 1000);
    initRadar();
    animate();
</script>
</body>
</html>
