<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #globeViz { width: 100vw; height: 100vh; }
        .radar-tag {
            position: absolute; top: 15px; left: 15px;
            background: rgba(0, 30, 0, 0.8); color: #0f0;
            padding: 12px; border: 1px solid #0f0;
            border-radius: 2px; z-index: 100; font-size: 13px;
            box-shadow: 0 0 10px rgba(0,255,0,0.3);
        }
    </style>
</head>
<body>

    <div class="radar-tag" id="status">A SINCRONIZAR RADAR...</div>
    <div id="globeViz"></div>

    <script>
        // 1. Configuração do Globo com Estrelas e Texturas Reais
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png') // Estrelas
            .showAtmosphere(true)
            .atmosphereColor('#3a228a')
            .atmosphereAltitude(0.2);

        // 2. Iluminação (Garante que um lado é Dia e outro é Noite)
        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // 3. Lógica Real: Cidade + Bandeira (Sem falhas de limite)
        async function rastreioReal() {
            const statusBox = document.getElementById('status');
            try {
                // Usamos a Cloudflare para o IP (infalível) + ipwhois para os dados
                const cf = await fetch('https://www.cloudflare.com/cdn-cgi/trace').then(r => r.text());
                const ip = cf.match(/ip=(.*)/)[1];
                
                const res = await fetch(`https://ipwho.is/${ip}`);
                const data = await res.json();

                if (data.success) {
                    const flag = data.country_code.toUpperCase().replace(/./g, char => 
                        String.fromCodePoint(char.charCodeAt(0) + 127397)
                    );

                    const infoTxt = `${flag} ${data.city}, ${data.country}`;
                    statusBox.innerHTML = `ALVO: ${infoTxt}<br>COORD: ${data.latitude}, ${data.longitude}`;

                    // Ponto no Globo
                    world.labelsData([{ lat: data.latitude, lng: data.longitude, text: infoTxt }])
                        .labelSize(3)
                        .labelColor(() => '#0f0')
                        .labelDotRadius(1)
                        .labelResolution(3);

                    world.ringsData([{ lat: data.latitude, lng: data.longitude }])
                        .ringColor(() => '#0f0')
                        .ringMaxRadius(5);

                    // Focar na localização do utilizador
                    world.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2 }, 3000);
                }
            } catch (err) {
                statusBox.innerHTML = "LIGAÇÃO ESTABELECIDA (AGUARDANDO DADOS)";
                console.error(err);
            }
        }

        rastreioReal();

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });
    </script>
</body>
</html>
