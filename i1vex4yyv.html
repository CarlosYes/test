<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v180 - INTEGRATED DESIGN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* HUD Estilo Player Integrado */
        .player-hud {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(57, 255, 20, 0.3);
            border-radius: 8px; padding: 15px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(10px); z-index: 1000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .info-group { display: flex; align-items: center; gap: 20px; }
        .status-light { width: 10px; height: 10px; background: #39ff14; border-radius: 50%; box-shadow: 0 0 10px #39ff14; }
        .city-name { color: #fff; font-size: 18px; font-weight: bold; letter-spacing: 1px; }
        .metadata { color: #39ff14; font-size: 10px; font-family: monospace; text-transform: uppercase; }
        
        .user-count { background: #39ff14; color: #000; padding: 5px 12px; border-radius: 4px; font-weight: 900; font-size: 14px; }

        /* Marcador no Globo */
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau { background: rgba(0,0,0,0.8); color: #39ff14; padding: 2px 8px; border: 1px solid #39ff14; border-radius: 4px; font-size: 10px; font-weight: bold; white-space: nowrap; }
        .d-rau { width: 8px; height: 8px; background: #fff; border-radius: 50%; margin-top: 2px; box-shadow: 0 0 15px #39ff14; animation: blink 0.8s infinite alternate; }
        @keyframes blink { from { opacity: 0.3; transform: scale(0.8); } to { opacity: 1; transform: scale(1.2); } }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="player-hud">
    <div class="info-group">
        <div id="led" class="status-light" style="background: #ff3131; box-shadow: 0 0 10px #ff3131;"></div>
        <div>
            <div id="city" class="city-name">A LOCALIZAR...</div>
            <div id="meta" class="metadata">AGUARDANDO CONEXÃO</div>
        </div>
    </div>
    <div class="user-count" id="count">0</div>
</div>

<script>
    const RAU_ID = 'PLAYER-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .atmosphereDaylightAlpha(0.1)
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau">${d.city}</div><div class="d-rau"></div>`;
            return el;
        });

    async function init() {
        let geo = null;

        // Tentativa de precisão real (Hardware)
        try {
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
            });
            const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
            const data = await rev.json();
            geo = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                city: (data.address.city || data.address.town || "LOCALIZADO").toUpperCase(),
                source: "PRECISION_LINK"
            };
        } catch (e) {
            // Fallback para IP (onde o ISP pode mentir)
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            geo = { lat: data.latitude, lng: data.longitude, city: data.city.toUpperCase(), source: "NETWORK_LINK" };
        }

        if (geo) {
            document.getElementById('city').innerText = geo.city;
            document.getElementById('meta').innerText = `STREANING VIA ${geo.source}`;
            document.getElementById('led').style.background = "#39ff14";
            document.getElementById('led').style.boxShadow = "0 0 10px #39ff14";

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter({ ...geo, clientId: RAU_ID });
                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 2 }, 2000);
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;
    init();
</script>
</body>
</html>
