<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v164 - PHYSICAL TRACE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .d-rau { width: 14px; height: 14px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.6s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(4.5); opacity: 0; } }
        #net-log { font-family: monospace; font-size: 10px; color: #39ff14; margin-top: 10px; opacity: 0.8; border-top: 1px solid #39ff1444; padding-top: 5px; }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 9px; letter-spacing: 5px; opacity: 0.7;">RAU SYSTEM v164</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace;">A RASTREAR ORIGEM FÍSICA...</div>
    <div id="net-log">NODE: -- | AS: --</div>
</div>

<div id="globeViz"></div>

<script>
    // ID de sessão único para limpar fantasmas instantaneamente
    const RAU_SESSION_ID = 'SESSION-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau"><span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function launch() {
        try {
            // Usamos o trace da Cloudflare que mostra o PoP (Point of Presence) real
            const traceRes = await fetch('https://1.1.1.1/cdn-cgi/trace');
            const traceText = await traceRes.text();
            const traceData = Object.fromEntries(traceText.split('\n').map(l => l.split('=')));
            
            // Agora consultamos a localização baseada no nó de infraestrutura, não apenas no IP
            const metaRes = await fetch('https://speed.cloudflare.com/meta?cb=' + Date.now());
            const metaData = await metaRes.json();

            document.getElementById('net-log').innerText = `NODE: ${traceData.colo} | AS: ${metaData.asOrganization}`;

            const geo = {
                lat: metaData.latitude,
                lng: metaData.longitude,
                city: (metaData.city || "ORIGIN").toUpperCase(),
                clientId: RAU_SESSION_ID
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `NÓ FIXADO: ${geo.city}`;
                channel.presence.enter(geo);

                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Limpeza rigorosa: se houver 2 sessões, o Map mantém apenas a última.
                            const points = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = points.length;
                            world.htmlElementsData(points);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.6 }, 2000);
        } catch (e) {
            document.getElementById('status').innerText = "ERRO NA ROTA FÍSICA";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    launch();
</script>
</body>
</html>
