<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - TOTAL PRECISION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { 
            width: 100%; max-width: 420px; 
            background: #050000; border-radius: 15px; border: 2.5px solid #ff0000; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.6); 
            overflow: hidden; position: relative; display: flex; flex-direction: column;
        }

        .title { font-size: 20px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; letter-spacing: 2px; border-bottom: 2px solid rgba(255,0,0,0.3); background: linear-gradient(to bottom, #1a0000, #050000); }
        
        #canvas-container { width: 100%; height: 320px; background: #000; position: relative; cursor: grab; }

        /* PONTOS DE PRECISÃO */
        .location-tag { position: absolute; pointer-events: none; z-index: 100; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); transition: all 0.3s ease; }
        
        /* Ativo (Verde) com Pulsação */
        .point-online { 
            width: 10px; height: 10px; background: #00ff00; border-radius: 50%; border: 1.5px solid #fff; 
            box-shadow: 0 0 15px #00ff00; z-index: 10;
            animation: pulse 1.5s infinite;
        }

        /* Histórico (Vermelho Escuro) */
        .point-offline { width: 6px; height: 6px; background: #880000; border-radius: 50%; border: 1px solid #440000; opacity: 0.6; }

        .tag-info { margin-bottom: 6px; background: rgba(0,0,0,0.9); border: 1px solid #0f0; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: #0f0; white-space: nowrap; text-transform: uppercase; box-shadow: 0 0 10px rgba(0,255,0,0.3); }

        /* PAINEL INFERIOR ROTATIVO */
        .location-window { height: 50px; background: linear-gradient(to top, #150000, #050000); border-top: 1px solid #600; position: relative; overflow: hidden; }
        .location-scroll-track { display: flex; flex-direction: column; width: 100%; transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1); }
        .location-item { height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 14px; text-transform: uppercase; font-weight: 900; letter-spacing: 1px; }
        .location-item img { width: 24px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.3)); }

        .header { padding: 10px; background: rgba(100, 0, 0, 0.1); border-top: 1px solid rgba(255,0,0,0.3); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 25px; }
        #time { font-size: 20px; font-weight: bold; font-family: 'Courier New', monospace; color: #fff; }
        .vis-pill { background: #ff0000; padding: 3px 14px; border-radius: 20px; font-size: 16px; font-weight: 900; border: 2px solid #fff; box-shadow: 0 0 10px rgba(255,0,0,0.5); }
        
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0.7); }
            70% { transform: scale(1.3); box-shadow: 0 0 0 10px rgba(0, 255, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0, 255, 0, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR v92.1 🎶</div>
    <div id="canvas-container"></div>
    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
    </div>
    <div class="location-window">
        <div class="location-scroll-track" id="locationData">
            <div class="location-item">INICIALIZANDO RASTREIO...</div>
        </div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            shininess: 20 
        })
    );
    globe.rotation.y = -Math.PI / 2; // Alinhamento Crítico para Portugal/Europa
    scene.add(globe);

    camera.position.set(2, 0.8, 2); 
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const sun = new THREE.DirectionalLight(0xffffff, 0.5);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    let markers = [];
    let historyUsers = new Map();
    let scrollIndex = 0;
    let currentFocusId = "";

    function latLngToVector3(lat, lng) {
        const radius = 1.012; 
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(
            -radius * Math.sin(phi) * Math.cos(theta),
            radius * Math.cos(phi),
            radius * Math.sin(phi) * Math.sin(theta)
        );
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!controls.active) globe.rotation.y += 0.001;

        markers.forEach(m => {
            const worldPos = m.vector.clone().applyMatrix4(globe.matrixWorld);
            const screenPos = worldPos.clone().project(camera);
            const isVisible = worldPos.angleTo(camera.position) < Math.PI / 2.05;

            if (isVisible) {
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(screenPos.x * 0.5 + 0.5) * container.clientWidth}px`;
                m.tag.style.top = `${(screenPos.y * -0.5 + 0.5) * container.clientHeight}px`;
                
                // Pormenor: O ponto focado ganha destaque no mapa
                const isFocused = (m.id === currentFocusId);
                const baseScale = isFocused ? 1.4 : 1.0;
                const dist = camera.position.distanceTo(worldPos);
                m.tag.style.transform = `translate(-50%, -50%) scale(${(1.5/dist) * baseScale})`;
                m.tag.style.opacity = isFocused ? "1" : "0.8";
            } else {
                m.tag.style.display = 'none';
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    // Ciclo de 5 segundos para mudar o foco
    setInterval(() => {
        const track = document.getElementById("locationData");
        const items = Array.from(historyUsers.values()).filter(u => u.online).reverse();
        
        if (items.length > 0) {
            scrollIndex = (scrollIndex + 1) % items.length;
            currentFocusId = items[scrollIndex].id;
            track.style.transform = `translateY(-${scrollIndex * 50}px)`;
        }
    }, 5000);

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myGeo = {
                id: SESSION_ID, city: (d.city || "LISBOA").toUpperCase(),
                country: d.countryName, code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude, lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);
                channel.presence.subscribe(() => {
                    channel.presence.get((err, members) => {
                        if (err) return;
                        const onlineCount = members.length;
                        document.getElementById('visNum').innerText = onlineCount.toString().padStart(2, '0');
                        
                        // Manter histórico rigoroso
                        historyUsers.forEach(u => u.online = false);
                        members.forEach(m => { 
                            if(m.data) historyUsers.set(m.data.id, { ...m.data, online: true }); 
                        });

                        markers.forEach(m => m.tag.remove());
                        markers = [];
                        const track = document.getElementById("locationData");
                        track.innerHTML = "";

                        const users = Array.from(historyUsers.values()).reverse();
                        users.forEach((u) => {
                            if(u.online) {
                                const item = document.createElement("div");
                                item.className = "location-item";
                                item.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                                track.appendChild(item);
                            }

                            const tag = document.createElement('div');
                            tag.className = 'location-tag';
                            tag.id = "tag-" + u.id;
                            
                            if(u.online) {
                                tag.innerHTML = `<div class="tag-info">${u.city}</div><div class="point-online"></div>`;
                            } else {
                                tag.innerHTML = `<div class="point-offline"></div>`;
                            }
                            
                            container.appendChild(tag);
                            markers.push({ id: u.id, tag, vector: latLngToVector3(u.lat, u.lng) });
                        });
                        
                        // Define o foco inicial se houver alguém online
                        const onlineOnes = users.filter(u => u.online);
                        if(onlineOnes.length > 0 && !currentFocusId) currentFocusId = onlineOnes[0].id;
                    });
                });
            });
        } catch(e) { console.error(e); }
    }

    setInterval(() => {
        document.getElementById('time').textContent = new Date().toLocaleTimeString();
    }, 1000);

    initRadar();
</script>
</body>
</html>
