<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR 2026 - UNIFIED DESIGN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
        
        /* DESIGN IDENTICO & REFORÇADO */
        .container { 
            width: 440px; background: #000; border-radius: 20px; border: 3px solid #ff0000; 
            box-shadow: 0 0 50px #ff0000; display: flex; flex-direction: column; position: relative;
        }

        .title { 
            font-size: 26px; text-align: center; font-weight: 900; color: #ff0000; 
            padding: 15px; text-shadow: 0 0 15px #ff0000; letter-spacing: 5px;
            background: rgba(255, 0, 0, 0.05);
        }

        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 15px 20px; background: rgba(255, 0, 0, 0.2); 
            border-top: 3px solid #ff0000; border-bottom: 3px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
        }

        .live-indicator { font-size: 24px; font-weight: 900; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        #time { font-size: 24px; font-weight: 900; color: #fff; font-family: monospace; }

        /* ETIQUETAS PADRONIZADAS */
        .globe-label {
            display: flex; align-items: center; gap: 12px; padding: 12px 24px;
            background: rgba(0, 0, 0, 0.95); border-radius: 40px; border: 2px solid #ff0000;
            box-shadow: 0 0 30px #ff0000; backface-visibility: hidden;
        }
        .globe-label span {
            color: #ff0000; font-weight: 900; font-size: 28px; text-transform: uppercase;
            text-shadow: 0 0 20px #ff0000; white-space: nowrap;
        }
        .status-dot { width: 16px; height: 16px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 15px #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">--</span></div>
        <span id="time">00:00:00</span>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-SECURE-' + Math.random().toString(36).substr(2, 5);

    // CONFIGURAÇÃO TÉCNICA DO GLOBO
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 440/320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // GLOBO REAL COM BASE SÓLIDA (PARA NUNCA FUGIR)
    const loader = new THREE.TextureLoader();
    const earthGeometry = new THREE.SphereGeometry(1, 64, 64);
    const earthMaterial = new THREE.MeshPhongMaterial({
        color: 0x111111,
        map: loader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg'),
        shininess: 50
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    globeGroup.add(earth);

    scene.add(new THREE.AmbientLight(0xffffff, 2.5));
    camera.position.set(2.4, 0.6, 2.4);

    let activeMarkers = new Map();

    async function startUnifiedService() {
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('radar-unified-2026');
        
        // CONEXÃO IDÊNTICA PARA TODOS
        ably.connection.on('connected', () => {
            channel.presence.enter({ city: "SINGAPORE", lat: 1.3521, lng: 103.8198 });
        });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                
                activeMarkers.forEach(m => scene.remove(m.label));
                activeMarkers.clear();

                members.forEach(m => {
                    const u = m.data;
                    const div = document.createElement('div');
                    div.className = 'globe-label';
                    div.innerHTML = `<div class="status-dot"></div><span>${u.city}</span>`;
                    const label = new THREE.CSS3DSprite(div);
                    label.scale.set(0.002, 0.002, 0.002);
                    scene.add(label);
                    activeMarkers.set(m.clientId, {label, lat: u.lat, lng: u.lng});
                });
            });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.008;
        
        // SINCRONIZAÇÃO DE ROTAÇÃO
        activeMarkers.forEach(m => {
            const phi = (90 - m.lat) * (Math.PI / 180);
            const theta = (m.lng + 180) * (Math.PI / 180) + globeGroup.rotation.y;
            m.label.position.set(-1.12 * Math.sin(phi) * Math.cos(theta), 1.12 * Math.cos(phi), 1.12 * Math.sin(phi) * Math.sin(theta));
        });

        renderer.render(scene, camera);
        css3dRenderer.render(scene, camera);
    }

    setInterval(() => { 
        document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); 
    }, 1000);

    startUnifiedService();
    animate();
</script>
</body>
</html>
