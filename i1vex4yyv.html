<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RADAR REAL TIME</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .container { 
            width: 100%; max-width: 480px; height: 92vh;
            background: rgba(10, 0, 0, 1); border: 2px solid #ff0000; border-radius: 15px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 40px #700;
        }

        .header { padding: 15px; text-align: center; background: #200; border-bottom: 1px solid #f00; }
        .title { color: #f00; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }

        #globeViz { flex: 1; position: relative; }

        .footer { 
            background: #000; padding: 15px; display: flex; 
            justify-content: space-between; border-top: 1px solid #400;
        }

        .vis-pill { background: #f00; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
        
        /* Tag de localização real */
        .m-tag { 
            background: rgba(0,0,0,0.9); border: 1px solid #f00; padding: 4px 8px;
            color: #fff; font-size: 11px; border-radius: 4px; display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body oncontextmenu="return false">

<div class="container">
    <div class="header">
        <div class="title">SISTEMA DE RASTREIO REAL</div>
        <div id="status" style="color: #39ff14; font-size: 10px; margin-top: 5px;">A LOCALIZAR DISPOSITIVO...</div>
    </div>

    <div id="globeViz"></div>

    <div class="footer">
        <div id="time" style="color:#fff;">00:00:00</div>
        <div class="vis-pill">LIVE: <span id="count">00</span></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    let ably, channel;
    
    // Objeto de dados vazio - Sem cidades pré-definidas
    let myData = { lat: 0, lng: 0, city: "A DETETAR...", country: "be" };

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#ff0000')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="m-tag"><img src="https://flagcdn.com/w20/${d.country.toLowerCase()}.png" width="16"> ${d.city}</div>
                    <div style="width:10px; height:10px; background:#f00; border-radius:50%; box-shadow:0 0 15px #f00; border:1px solid #fff;"></div>
                </div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // Firmamento Estático (Estrelas que não se mexem)
    const scene = world.scene();
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 10000; i++) {
        starCoords.push(THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000), THREE.MathUtils.randFloatSpread(3000));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));

    async function startRadar() {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'ID-' + Math.random().toString(36).substr(2, 5) });
        channel = ably.channels.get('malajes-live');

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                const pts = members.map(m => m.data);
                document.getElementById('count').innerText = pts.length.toString().padStart(2, '0');
                world.htmlElementsData(pts);
            });
        });

        // --- A VERDADEIRA LOCALIZAÇÃO ---
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                // Aqui pegamos as coordenadas REAIS do teu GPS/Wi-Fi
                myData.lat = pos.coords.latitude;
                myData.lng = pos.coords.longitude;

                // Convertemos as coordenadas em nome de cidade real
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myData.lat}&lon=${myData.lng}`);
                    const json = await res.json();
                    myData.city = (json.address.city || json.address.town || json.address.village || "LOCALIZAÇÃO REAL").toUpperCase();
                    myData.country = json.address.country_code;
                    
                    document.getElementById('status').innerText = "GPS ATIVO: " + myData.city;
                } catch(e) { myData.city = "COORDENADAS REAIS"; }

                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 1.8 }, 2000);

            }, async (err) => {
                // Se o GPS falhar (utilizador negou), usamos o IP como último recurso
                document.getElementById('status').innerText = "GPS NEGADO. A USAR REDE...";
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                myData = { lat: d.latitude, lng: d.longitude, city: d.city.toUpperCase(), country: d.country_code.toLowerCase() };
                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 2 }, 2000);
            }, { enableHighAccuracy: true });
        }
    }

    setInterval(() => { document.getElementById('time').innerText = new Date().toLocaleTimeString(); }, 1000);
    startRadar();
</script>
</body>
</html>
