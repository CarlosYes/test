<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR 2026 - SECURE & UNLIMITED</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 10px; overflow: hidden; }
        
        /* CONTENTOR REFORÇADO */
        .container { 
            width: 440px; background: #000; border-radius: 25px; border: 3px solid #ff0000; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.8), inset 0 0 20px rgba(255, 0, 0, 0.4); 
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }

        .title { 
            font-size: 28px; text-align: center; font-weight: 950; color: #ff0000; 
            padding: 18px; text-shadow: 0 0 25px #ff0000; letter-spacing: 6px;
            background: linear-gradient(to bottom, rgba(255,0,0,0.15), transparent);
        }

        #canvas-globe { width: 100%; height: 320px; background: #000; cursor: crosshair; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 15px 25px; background: rgba(255, 0, 0, 0.1); 
            border-top: 2px solid #ff0000; border-bottom: 2px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
            backdrop-filter: blur(10px);
        }
        .live-indicator { font-size: 24px; font-weight: 950; color: #00ff00; text-shadow: 0 0 20px #00ff00; }
        #time { font-size: 24px; font-weight: 900; color: #fff; font-family: 'Courier New', monospace; letter-spacing: 2px; }

        /* ETIQUETA VERMELHO RELUZENTE 2026 */
        .globe-label {
            display: flex; align-items: center; gap: 15px; padding: 12px 25px;
            background: rgba(0, 0, 0, 0.9); border-radius: 50px; border: 2px solid #ff0000;
            box-shadow: 0 0 40px #ff0000, inset 0 0 15px rgba(255,0,0,0.5); 
            backface-visibility: hidden;
        }
        .globe-label span {
            color: #ff0000; font-weight: 900; font-size: 26px; text-transform: uppercase;
            text-shadow: 0 0 20px #ff0000, 0 0 40px #ff0000; white-space: nowrap;
            animation: textPulse 1.5s infinite alternate;
        }
        .dot { width: 18px; height: 18px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 25px #00ff00; }

        @keyframes textPulse {
            from { text-shadow: 0 0 15px #ff0000; opacity: 0.8; }
            to { text-shadow: 0 0 35px #ff0000, 0 0 50px #ff0000; opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">01</span></div>
        <span id="time">00:00:00</span>
    </div>
</div>

<script>
    // Configuração de Segurança Total
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 5);
    
    // Coordenadas Reais Blindadas (Singapura)
    const REAL_LAT = 1.3521;
    const REAL_LNG = 103.8198;

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 440/320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dScene = new THREE.Scene();
    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    // GLOBO REALÍSTICO 2026
    const loader = new THREE.TextureLoader();
    const earthGeometry = new THREE.SphereGeometry(1, 128, 128);
    const earthMaterial = new THREE.MeshPhongMaterial({
        map: loader.load('https://unpkg.com/three-globe/example/img/earth-night.jpg'), // Luzes reais de 2026
        bumpMap: loader.load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
        bumpScale: 0.15,
        shininess: 30
    });
    const earth = new THREE.Mesh(earthGeometry, earthMaterial);
    globeGroup.add(earth);

    // Atmosfera Azul Real
    const atmoGeom = new THREE.SphereGeometry(1.02, 128, 128);
    const atmoMat = new THREE.MeshBasicMaterial({ color: 0x0055ff, side: THREE.BackSide, transparent: true, opacity: 0.25 });
    globeGroup.add(new THREE.Mesh(atmoGeom, atmoMat));

    // Iluminação 
    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(5, 3, 5);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0x404040, 4));

    camera.position.set(2.4, 0.8, 2.4);

    let activeMarkers = new Map();

    async function initSecureRadar() {
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('radar-2026-unlimited');
        
        // Entrada segura: Forçamos Singapura para o mundo ver
        channel.presence.enter({ city: "SINGAPORE", lat: REAL_LAT, lng: REAL_LNG });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                
                activeMarkers.forEach(m => css3dScene.remove(m.label));
                activeMarkers.clear();

                members.forEach(m => {
                    const u = m.data; if(!u.lat) return;
                    const div = document.createElement('div');
                    div.className = 'globe-label';
                    div.innerHTML = `<div class="dot"></div><span>${u.city}</span>`;
                    const label = new THREE.CSS3DSprite(div);
                    label.scale.set(0.002, 0.002, 0.002);
                    
                    const phi = (90 - u.lat) * (Math.PI / 180);
                    const theta = (u.lng + 180) * (Math.PI / 180);
                    label.position.set(-1.1 * Math.sin(phi) * Math.cos(theta), 1.1 * Math.cos(phi), 1.1 * Math.sin(phi) * Math.sin(theta));
                    
                    css3dScene.add(label);
                    activeMarkers.set(m.clientId, {label});
                });
            });
        });
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.008; // Rotação rápida e constante
        css3dScene.rotation.y = globeGroup.rotation.y;
        renderer.render(scene, camera);
        css3dRenderer.render(css3dScene, camera);
    }

    // Relógio Digital
    setInterval(() => { 
        document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); 
    }, 1000);

    initSecureRadar();
    animate();
    document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
