<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #radar-box {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 40, 0, 0.9); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <div id="radar-box">SISTEMA: A LOCALIZAR VISITANTE...</div>
    <div id="globeViz"></div>

    <script>
        // Configuração do Globo
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .nightImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#00ff00')
            .atmosphereAltitude(0.15);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.8;

        async function iniciarRadar() {
            try {
                // Ligar ao Worker que já está a funcionar
                const response = await fetch('https://globorau.carlos2022yes.workers.dev/');
                const data = await response.json();
                
                const local = `${data.flag} ${data.city}, ${data.country}`;
                document.getElementById('radar-box').innerHTML = `LOCALIZADO: ${local}`;

                // Adicionar o ponto no mapa
                const marker = [{ lat: data.latitude, lng: data.longitude, size: 1, color: '#00ff00' }];
                
                world.pointsData(marker)
                    .pointAltitude(0.1)
                    .pointColor('color');

                world.ringsData(marker)
                    .ringColor(() => '#00ff00')
                    .ringMaxRadius(5)
                    .ringPropagationSpeed(3);

                // Focar a câmara no visitante
                world.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2 }, 2000);

            } catch (err) {
                document.getElementById('radar-box').innerHTML = "ERRO: FALHA NA SINCRONIZAÇÃO";
            }
        }

        iniciarRadar();
    </script>
</body>
</html>
