<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU SYSTEM v92 - BRIGHT EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(10, 0, 0, 0.98); 
            border-radius: 15px; border: 2.5px solid #ff0000; 
            box-shadow: 0 0 35px rgba(255, 0, 0, 0.6); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; border-bottom: 2px solid rgba(255,0,0,0.3); }
        
        #canvas-globe { 
            width: 100%; height: 320px; 
            background: #000; 
            position: relative; 
        }

        .header { padding: 12px; background: rgba(150, 0, 0, 0.25); border-top: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; font-family: 'Courier New', monospace; }
        
        .vis-pill { background: #ff0000; padding: 5px 18px; border-radius: 20px; font-size: 22px; font-weight: 900; color: #fff; border: 2px solid #fff; min-width: 80px; text-align: center; box-shadow: 0 0 15px #f00; }

        .location-list { 
            max-height: 160px; 
            overflow-y: auto; 
            padding: 12px; 
            background: #080000; 
            border-top: 2px solid #400; 
        }
        
        .location-item { 
            padding: 10px; 
            background: rgba(255,0,0,0.12); 
            border-left: 5px solid #f00; 
            border-radius: 5px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 10px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: 900;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .location-item img { width: 24px; height: 16px; border-radius: 2px; border: 1px solid rgba(255,255,255,0.3); }

        #date { font-size: 11px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1.5px; }

        /* Scrollbar */
        .location-list::-webkit-scrollbar { width: 6px; }
        .location-list::-webkit-scrollbar-thumb { background: #f00; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-globe"></div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    // --- CONFIGURAÇÃO DO GLOBO ILUMINADO ---
    const container = document.getElementById('canvas-globe');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Texturas de alta visibilidade
    const textureLoader = new THREE.TextureLoader();
    const earthMap = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');

    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const material = new THREE.MeshPhongMaterial({
        map: earthMap,
        shininess: 15,
        reflectivity: 1
    });
    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    // SISTEMA DE LUZES (MÁXIMA CLARIDADE)
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2); // Luz geral muito forte
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8); // Luz frontal
    sunLight.position.set(5, 3, 5);
    scene.add(sunLight);

    const redGlow = new THREE.PointLight(0xff0000, 1.5, 10); // Brilho vermelho de fundo
    redGlow.position.set(-2, -1, -3);
    scene.add(redGlow);

    camera.position.z = 2.6;

    function animateGlobe() {
        requestAnimationFrame(animateGlobe);
        globe.rotation.y += 0.004;
        renderer.render(scene, camera);
    }
    animateGlobe();

    // --- LÓGICA DE DADOS ---
    function updateClock() {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function startSystem() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            
            const geo = {
                city: (d.city || d.locality || "Desconhecido").toUpperCase(),
                country: d.countryName || "Mundo",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude,
                lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            let total = members.length;
                            document.getElementById('visNum').innerText = total < 10 ? "0" + total : total;
                            const list = document.getElementById("locationData");
                            list.innerHTML = "";
                            members.forEach(member => {
                                const u = member.data;
                                if (u && u.city) {
                                    const div = document.createElement("div");
                                    div.className = "location-item";
                                    div.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city} - ${u.country}</span>`;
                                    list.appendChild(div);
                                }
                            });
                        }
                    });
                });
            });
        } catch(e) { console.error(e); }
    }

    startSystem();
</script>
</body>
</html>
