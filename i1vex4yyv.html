<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAU RADAR - ELITE EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', monospace; }
        body { background: #000; overflow: hidden; height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; }
        
        /* Container Principal com Estética Malajes */
        .main-container {
            width: 100%; max-width: 500px; height: 95vh;
            background: rgba(10, 0, 0, 0.95);
            border: 2px solid #ff0000;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.4);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HUD Superior */
        .header {
            padding: 15px;
            background: rgba(150, 0, 0, 0.2);
            border-bottom: 1px solid rgba(255, 0, 0, 0.3);
            text-align: center;
            z-index: 10;
        }

        .title { color: #ff4444; font-size: 20px; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px #ff0000; }
        
        /* Área do Globo */
        #globeViz { flex-grow: 1; width: 100%; position: relative; background: #000; }

        /* HUD de Informação Estilo Malajes */
        .info-panel {
            display: flex; justify-content: space-around; align-items: center;
            padding: 12px; background: #050000; color: #fff;
        }

        .vis-pill {
            background: #ff0000; padding: 5px 15px; border-radius: 20px;
            font-weight: bold; font-size: 18px; border: 1px solid #fff;
            box-shadow: 0 0 10px #ff0000;
        }

        #time { font-size: 20px; font-weight: bold; color: #ff4444; }

        /* Lista de Localizações */
        .location-list {
            height: 150px; overflow-y: auto; background: #000;
            padding: 10px; border-top: 2px solid #300;
        }

        .location-item {
            padding: 8px; background: rgba(255, 0, 0, 0.1);
            border-left: 4px solid #f00; border-radius: 4px;
            display: flex; align-items: center; gap: 10px; margin-bottom: 6px;
            font-size: 12px; font-weight: bold; color: #fff; text-transform: uppercase;
        }
        .location-item img { width: 20px; border-radius: 2px; }

        /* Marcadores no Globo */
        .m-tag { 
            display: flex; align-items: center; gap: 5px; 
            background: rgba(0,0,0,0.85); padding: 3px 7px; 
            border: 1px solid #ff0000; border-radius: 3px;
            color: #fff; font-size: 9px; white-space: nowrap;
        }
    </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">

<div class="main-container">
    <div class="header">
        <div class="title">RAU RADAR ELITE</div>
        <div id="date" style="font-size: 10px; color: #aaa; margin-top: 5px;"></div>
    </div>

    <div id="globeViz"></div>

    <div class="info-panel">
        <div id="time">00:00:00</div>
        <div class="vis-pill">LIVE: <span id="count">00</span></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    // Configurações de Estado (Persistência)
    const settings = {
        volume: localStorage.getItem('rau_volume') || 0.5,
        autoplay: localStorage.getItem('rau_autoplay') || 'true'
    };

    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    let archive = new Map();

    // Inicializar Globo
    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#ff0000')
        .htmlElement(d => {
            const el = document.createElement('div');
            const c = (d.country || '??').toLowerCase();
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="m-tag">
                        <img src="https://flagcdn.com/w20/${c}.png" style="width:15px">
                        <span>${d.city}</span>
                    </div>
                    <div style="width:6px; height:6px; background:#ff0000; border-radius:50%; box-shadow:0 0 10px #ff0000; border:1px solid #fff;"></div>
                </div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // --- FIRMAMENTO ESTÁTICO ---
    const scene = world.scene();
    const starGeometry = new THREE.BufferGeometry();
    const starVertices = [];
    for (let i = 0; i < 6000; i++) {
        const x = THREE.MathUtils.randFloatSpread(3000);
        const y = THREE.MathUtils.randFloatSpread(3000);
        const z = THREE.MathUtils.randFloatSpread(3000);
        if (Math.sqrt(x*x + y*y + z*z) > 400) starVertices.push(x, y, z);
    }
    starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
    const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.5 });
    scene.add(new THREE.Points(starGeometry, starMaterial));

    // Lógica de Sincronização
    async function init() {
        try {
            const res = await fetch('https://speed.cloudflare.com/meta');
            const data = await res.json();
            const geo = {
                lat: data.latitude, lng: data.longitude,
                city: (data.city || "EUROPE").toUpperCase(),
                country: (data.country || "be").toLowerCase()
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'RAU-' + Math.random().toString(36).substr(2, 4) });
            const channel = ably.channels.get('rau-elite-radar');

            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    const list = document.getElementById("locationData");
                    list.innerHTML = "";
                    const activeMembers = members.map(m => {
                        const div = document.createElement("div");
                        div.className = "location-item";
                        div.innerHTML = `<img src="https://flagcdn.com/w40/${m.data.country}.png"> <span>${m.data.city}</span>`;
                        list.appendChild(div);
                        return m.data;
                    });
                    document.getElementById('count').innerText = activeMembers.length.toString().padStart(2, '0');
                    world.htmlElementsData(activeMembers);
                });
            });
            channel.presence.enter(geo);
            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 2 }, 2000);
        } catch (e) { console.error("OFFLINE MODE"); }
    }

    // Relógio e Data
    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
    }, 1000);

    // Segurança contra F12 e Inspeção
    document.onkeydown = function(e) {
        if(e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0)))) return false;
    }

    init();
</script>
</body>
</html>
