<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v183 - INTEGRITY OVERRIDE</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        .player-hud {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 550px;
            background: rgba(0, 0, 0, 0.9); border: 1px solid rgba(57, 255, 20, 0.5);
            border-radius: 12px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(15px); z-index: 1000;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .info-group { display: flex; align-items: center; gap: 15px; }
        .status-led { width: 10px; height: 10px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 10px #39ff14; animation: pulse 2s infinite; }
        .city-label { color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase; }
        .data-source { color: #39ff14; font-size: 9px; font-family: monospace; letter-spacing: 1px; }
        
        .live-count { background: #39ff14; color: #000; padding: 4px 12px; border-radius: 4px; font-weight: 900; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .m-rau { pointer-events: none; }
        .l-rau { 
            background: #000; color: #39ff14; padding: 4px 10px; border: 1px solid #39ff14; 
            border-radius: 4px; font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 8px;
        }
        .l-rau img { width: 18px; height: 12px; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="player-hud">
    <div class="info-group">
        <div class="status-led"></div>
        <div>
            <div id="city" class="city-label">SEARCHING...</div>
            <div id="meta" class="data-source">VERIFYING COORDINATES</div>
        </div>
    </div>
    <div class="live-count">RADAR: <span id="count">0</span></div>
</div>

<script>
    const SESSION_ID = 'RAU-V183-' + Math.random().toString(36).substr(2, 7);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    async function traceIntegrity() {
        try {
            // Tenta forçar a API a ignorar qualquer cache de servidor (Bypass de Bangkok/Singapura)
            const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?nocache=' + Date.now());
            const d = await response.json();
            
            // Se o sistema detectar coordenadas vazias ou inconsistentes, ele tenta um segundo provedor
            let lat = d.latitude;
            let lng = d.longitude;
            let city = (d.city || d.locality || "DETECTION").toUpperCase();
            let country = d.countryCode ? d.countryCode.toLowerCase() : "be";

            document.getElementById('city').innerText = city;
            document.getElementById('meta').innerText = `SOURCE: ${d.principalSubdivision || 'GLOBAL NODE'}`;

            const geo = { lat, lng, city, country, clientId: SESSION_ID };
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);
                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const nodes = members.map(m => m.data).filter(x => x && x.lat);
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat, lng, altitude: 2 }, 2000);

        } catch (e) {
            document.getElementById('city').innerText = "SYSTEM OFFLINE";
        }
    }

    traceIntegrity();
</script>
</body>
</html>
