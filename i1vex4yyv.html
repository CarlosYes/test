<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAU RADAR v198 - PULSING COSMOS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', sans-serif; height: 100vh; width: 100vw; }
        #globeViz { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .p-hud {
            position: absolute; top: 30px; left: 20px;
            background: rgba(0,0,0,0.85); border-left: 2px solid #39ff14;
            padding: 12px 18px; color: #fff; z-index: 1000;
            border-radius: 0 4px 4px 0; backdrop-filter: blur(8px);
        }
        .p-city { font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .p-live { color: #39ff14; font-size: 10px; font-family: monospace; margin-top: 6px; }

        .m-rau { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .m-tag { 
            display: flex; align-items: center; gap: 6px; 
            background: rgba(0, 0, 0, 0.95); padding: 4px 8px; 
            border: 1px solid #39ff14; border-radius: 2px; margin-bottom: 4px;
        }
        .m-flag { width: 16px; height: auto; }
        .m-city { color: #fff; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        
        .dot-active { 
            width: 6px; height: 6px; background: #39ff14; border-radius: 50%; 
            box-shadow: 0 0 10px #39ff14; border: 1px solid #fff;
        }
        .dot-ghost { width: 4px; height: 4px; background: #440000; border-radius: 50%; opacity: 0.6; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="p-hud">
    <div id="status-text" class="p-city">COSMOS SYNC...</div>
    <div class="p-live">LIVE NODES: <span id="count">0</span></div>
</div>

<script>
    const RAU_ID = 'PULSE-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 18;
    const globeImg = isNight ? '//unpkg.com/three-globe/example/img/earth-night.jpg' : '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg';

    let archive = new Map();

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl(globeImg)
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor(isNight ? '#39ff14' : '#87CEEB')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            if (d.status === 'active') {
                const hasFlag = d.country && d.country !== '??';
                const flagHtml = hasFlag ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png" class="m-flag">` : '';
                el.innerHTML = `<div class="m-tag">${flagHtml}<span class="m-city">${d.city}</span></div><div class="dot-active"></div>`;
            } else { el.innerHTML = `<div class="dot-ghost"></div>`; }
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // --- ESTRELAS ESTÁTICAS COM PISCA-PISCA (20s) ---
    const starsGeometry = new THREE.BufferGeometry();
    const starsVertices = [];
    for (let i = 0; i < 6000; i++) {
        const x = THREE.MathUtils.randFloatSpread(2000);
        const y = THREE.MathUtils.randFloatSpread(2000);
        const z = THREE.MathUtils.randFloatSpread(2000);
        if (Math.sqrt(x*x + y*y + z*z) > 250) starsVertices.push(x, y, z);
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
    
    const starsMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.8,
        transparent: true,
        opacity: 0.8
    });
    
    const starField = new THREE.Points(starsGeometry, starsMaterial);
    world.scene().add(starField);

    // Lógica do Pisca-Pisca (20 segundos)
    function animateStars() {
        const time = Date.now() * 0.001; // Tempo em segundos
        // Ciclo de 20 segundos para a opacidade (0.2 a 1.0)
        const pulse = (Math.sin(time * (Math.PI * 2 / 20)) + 1) / 2; 
        starsMaterial.opacity = 0.2 + (pulse * 0.8);
        requestAnimationFrame(animateStars);
    }
    animateStars();

    // Motor de Responsividade
    window.addEventListener('resize', () => {
        world.width(window.innerWidth);
        world.height(window.innerHeight);
    });

    async function launch() {
        try {
            const res = await fetch('https://speed.cloudflare.com/meta');
            const data = await res.json();
            const myGeo = {
                lat: data.latitude || 0, lng: data.longitude || 0,
                city: data.city ? data.city.toUpperCase() : "GLOBAL USER",
                country: data.country ? data.country.toLowerCase() : "??",
                status: 'active'
            };
            document.getElementById('status-text').innerText = myGeo.city;

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);
                channel.presence.subscribe(msg => {
                    if (['enter', 'present', 'update'].includes(msg.action)) archive.set(msg.clientId, {...msg.data, status: 'active'});
                    else if (msg.action === 'leave') {
                        const p = archive.get(msg.clientId);
                        if (p) archive.set(msg.clientId, {...p, status: 'ghost'});
                    }
                    const nodes = Array.from(archive.values());
                    document.getElementById('count').innerText = nodes.filter(n => n.status === 'active').length;
                    world.htmlElementsData(nodes.filter(n => n.lat !== undefined));
                });
            });
            world.pointOfView({ lat: myGeo.lat, lng: myGeo.lng, altitude: 2 }, 1500);
        } catch (e) { document.getElementById('status-text').innerText = "GENERAL ACCESS"; }
    }

    launch();
</script>
</body>
</html>
