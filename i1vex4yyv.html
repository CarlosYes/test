<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Courier New', monospace; transition: background 1s; }
        #radar-box {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 30, 0, 0.9); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="radar-box">SISTEMA: A LOCALIZAR...</div>
    <div id="globeViz"></div>

    <script>
        const hora = new Date().getHours();
        const eDia = hora >= 7 && hora < 19;
        const corFundo = eDia ? '#87CEEB' : '#000000';
        const imgTerra = eDia ? 'https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg' : 'https://unpkg.com/three-globe/example/img/earth-night.jpg';

        document.body.style.background = corFundo;

        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl(imgTerra)
            .backgroundColor(corFundo)
            .showAtmosphere(true)
            .atmosphereColor('#00ff00');

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        async function iniciar() {
            // 1. Obter dados do Worker (Bandeira e Cidade do IP)
            let workerData = { city: "Localização", flag: "📍", lat: 0, lng: 0 };
            try {
                const res = await fetch('https://globorau.carlos2022yes.workers.dev/');
                workerData = await res.json();
            } catch (e) { console.error("Erro worker"); }

            // 2. Tentar GPS para precisão real
            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    renderizar(pos.coords.latitude, pos.coords.longitude, workerData.city, workerData.flag);
                }, () => {
                    // Se recusar GPS, usa os dados do Worker
                    renderizar(workerData.latitude, workerData.longitude, workerData.city, workerData.flag);
                });
            }
        }

        function renderizar(lat, lng, cidade, bandeira) {
            const labelTexto = `${bandeira} ${cidade.toUpperCase()}`;
            
            document.getElementById('radar-box').innerHTML = `LOCALIZADO: ${labelTexto}`;

            // Pontinho verde e texto no globo
            world.labelsData([{ lat, lng, text: labelTexto }])
                .labelColor(() => '#00ff00')
                .labelSize(2)
                .labelDotRadius(0.5) // O "pontinho verde" que pediste
                .labelResolution(2);

            // Anel pulsante verde
            world.ringsData([{ lat, lng }])
                .ringColor(() => '#00ff00')
                .ringMaxRadius(5)
                .ringPropagationSpeed(2);

            world.pointOfView({ lat, lng, altitude: 2 }, 2000);
        }

        iniciar();
    </script>
</body>
</html>
