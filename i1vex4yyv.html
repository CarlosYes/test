<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #radar-display {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 20, 0, 0.9); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>

    <div id="radar-display">RADAR: A IDENTIFICAR ALVO...</div>
    <div id="globeViz"></div>

    <script>
        const display = document.getElementById('radar-display');

        // 1. Configuração do Globo (Dia/Noite e Estrelas)
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .nightImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#3a228a');

        const scene = world.scene();
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1.2);
        sun.position.set(1, 1, 1);
        scene.add(sun);

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.5;

        // 2. SISTEMA DE LOCALIZAÇÃO SEM APIs BLOQUEADAS
        async function localizarVisitante() {
            try {
                // Passo 1: Obter localização via base de dados de rede do browser (Mais fiável que APIs externas)
                // Usamos o serviço do Cloudflare que é permitido pelo GitHub
                const cf = await fetch('https://www.cloudflare.com/cdn-cgi/trace').then(r => r.text());
                const ip = cf.match(/ip=(.*)/)[1];
                const colo = cf.match(/colo=(.*)/)[1]; // Código do centro de dados (ex: LIS para Lisboa)

                // Passo 2: Traduzir o código da Cloudflare para Nome Real (Plano B caso a API falhe)
                // Mas vamos tentar uma API via HTTPS que o GitHub permite (GeoJS)
                const response = await fetch(`https://get.geojs.io/v1/ip/geo/${ip}.json`);
                const data = await response.json();

                if (data.city) {
                    const flag = data.country_code.toUpperCase().replace(/./g, char => 
                        String.fromCodePoint(char.charCodeAt(0) + 127397)
                    );

                    const local = `${flag} ${data.city}, ${data.country}`;
                    display.innerHTML = `ALVO DETETADO: ${local}`;

                    world.labelsData([{ lat: parseFloat(data.latitude), lng: parseFloat(data.longitude), text: local }])
                        .labelSize(3).labelColor(() => '#00ff00');
                    
                    world.ringsData([{ lat: parseFloat(data.latitude), lng: parseFloat(data.longitude) }])
                        .ringColor(() => '#00ff00');

                    world.pointOfView({ lat: parseFloat(data.latitude), lng: parseFloat(data.longitude), altitude: 2 }, 2000);
                }
            } catch (e) {
                display.innerHTML = "SISTEMA ONLINE (REDE PRIVADA)";
            }
        }

        localizarVisitante();

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });
    </script>
</body>
</html>
