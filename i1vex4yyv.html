<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #radar {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 15, 0, 0.9); color: #00ff00;
            padding: 15px; border: 1px solid #00ff00;
            z-index: 100; font-size: 13px; box-shadow: 0 0 20px rgba(0,255,0,0.3);
            border-radius: 4px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="radar">SISTEMA ATMOSFÉRICO: ONLINE...</div>
    <div id="globeViz"></div>

    <script>
        // 1. Configuração do Globo com Camadas Reais
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .nightImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
            .bumpImageUrl('https://unpkg.com/three-globe/example/img/earth-topology.png')
            .backgroundImageUrl('https://unpkg.com/three-globe/example/img/night-sky.png')
            .showAtmosphere(true)
            .atmosphereColor('#3a228a')
            .atmosphereAltitude(0.18);

        // 2. Adicionar Camada de Nuvens Dinâmicas
        const CLOUDS_IMG_URL = 'https://unpkg.com/three-globe/example/img/earth-clouds.png';
        const CLOUDS_ALT = 0.004;
        const CLOUDS_ROTATION_SPEED = -0.006; // graus por frame

        new THREE.TextureLoader().load(CLOUDS_IMG_URL, cloudsTexture => {
            const clouds = new THREE.Mesh(
                new THREE.SphereGeometry(world.getGlobeRadius() * (1 + CLOUDS_ALT), 75, 75),
                new THREE.MeshPhongMaterial({ map: cloudsTexture, transparent: true })
            );
            world.scene().add(clouds);

            (function rotateClouds() {
                clouds.rotation.y += CLOUDS_ROTATION_SPEED * Math.PI / 180;
                requestAnimationFrame(rotateClouds);
            })();
        });

        // 3. Configurar Iluminação Solar
        const scene = world.scene();
        const sunLight = new THREE.DirectionalLight(0xffffff, 1.8);
        sunLight.position.set(1, 1, 1);
        scene.add(sunLight);
        scene.add(new THREE.AmbientLight(0xbbbbbb, 0.3));

        world.controls().autoRotate = true;
        world.controls().autoRotateSpeed = 0.4;

        // 4. Identificação Real via Cloudflare + IPWhois
        async function radar() {
            try {
                const cf = await fetch('https://www.cloudflare.com/cdn-cgi/trace').then(r => r.text());
                const ip = cf.match(/ip=(.*)/)[1];
                const res = await fetch(`https://ipwho.is/${ip}`);
                const data = await res.json();

                if (data.success) {
                    const flag = data.country_code.toUpperCase().replace(/./g, char => 
                        String.fromCodePoint(char.charCodeAt(0) + 127397)
                    );

                    const info = `${flag} ${data.city}, ${data.country}`;
                    document.getElementById('radar').innerHTML = `ALVO: ${info}<br>CLIMA: DINÂMICO`;

                    world.labelsData([{ lat: data.latitude, lng: data.longitude, text: info }])
                        .labelSize(2.8)
                        .labelColor(() => '#00ff00')
                        .labelDotRadius(0.8);

                    world.ringsData([{ lat: data.latitude, lng: data.longitude }])
                        .ringColor(() => '#00ff00')
                        .ringMaxRadius(4);

                    world.pointOfView({ lat: data.latitude, lng: data.longitude, altitude: 2 }, 3000);
                }
            } catch (err) {
                document.getElementById('radar').innerText = "RADAR: LIGAÇÃO INSTÁVEL";
            }
        }

        radar();

        window.addEventListener('resize', () => {
            world.width(window.innerWidth);
            world.height(window.innerHeight);
        });
    </script>
</body>
</html>
