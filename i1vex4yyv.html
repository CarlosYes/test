<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - REPLICA DESIGN</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* DESIGN DO GLOBO (IGUAL AO LINK XATRADIO) */
        .globe-container {
            position: relative;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: #000;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 150, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* MAPA DO TEU GITHUB */
        .globe-map {
            position: absolute;
            width: 200%;
            height: 100%;
            background: url('https://carlosyes.github.io/rauglobe1/img/map.png') repeat-x;
            background-size: contain;
            animation: rotateMap 30s linear infinite;
            opacity: 0.8;
            z-index: 1;
        }

        /* MÁSCARA DE LUZ QUE DÁ O EFEITO 3D DO LINK */
        .globe-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                        rgba(255, 255, 255, 0.15) 0%, 
                        transparent 50%, 
                        rgba(0, 0, 0, 0.85) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* HUD DE DADOS (TEU ESTILO) */
        .hud {
            position: absolute;
            bottom: 40px;
            text-align: center;
            color: #00b4ff;
            z-index: 10;
            pointer-events: none;
        }

        .visitor-count {
            display: block;
            font-size: 55px;
            font-weight: 900;
            color: #fff;
            line-height: 1;
            text-shadow: 0 0 20px rgba(0, 180, 255, 0.6);
        }

        .status-text {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }

        @keyframes rotateMap {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Camada de Segurança */
        .secure { position: absolute; width: 100%; height: 100%; z-index: 20; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="globe-container">
        <div class="secure"></div>
        <div class="globe-map"></div>
        <div class="globe-overlay"></div>
    </div>

    <div class="hud">
        <span id="count" class="visitor-count">0</span>
        <div class="status-text" id="status">A RASTREAR...</div>
    </div>

    <script>
        // TEUS DADOS EXATOS
        const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
        const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

        // MOTOR DE PRECISÃO EXTREMA (TEU CÓDIGO)
        async function getExtremeLoc() {
            try {
                const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
                const d = await response.json();
                
                if (d.latitude) {
                    const geo = {
                        lat: d.latitude,
                        lng: d.longitude,
                        city: (d.city || d.locality || "OSTEND").toUpperCase(),
                        country: d.countryCode.toLowerCase()
                    };
                    startSync(geo);
                }
            } catch (e) {
                document.getElementById('status').innerText = "ERRO DE SATÉLITE";
            }
        }

        function startSync(geo) {
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `FIXADO: ${geo.city}`;
                channel.presence.enter(geo);

                const update = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            document.getElementById('count').innerText = members.length;
                        }
                    });
                };
                
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], update);
                update();
            });
        }

        getExtremeLoc();

        // Bloqueio de segurança
        document.onkeydown = (e) => {
            if (e.ctrlKey && (e.key === 'u' || e.key === 'i' || e.key === 'j')) return false;
        };
    </script>
</body>
</html>
