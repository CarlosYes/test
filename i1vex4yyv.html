<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v148 - PRECISION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .l-rau img { width: 20px; height: 13px; object-fit: cover; }
        .d-rau { width: 12px; height: 12px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.6s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(3.5); opacity: 0; } }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 10px; letter-spacing: 5px;">RAU SYSTEM v148</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace;">A ISOLAR NÓ FÍSICO...</div>
</div>

<div id="globeViz"></div>

<script>
    // Geramos um ID que persiste apenas enquanto a aba estiver aberta
    // Isso garante que, se houver refresh, o servidor Ably substitui o anterior imediatamente.
    const RAU_SESSION_KEY = 'RAU-NODE-' + Math.random().toString(36).substr(2, 9);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function syncSystem() {
        try {
            // Interrogamos o nó de infraestrutura real (técnica Cloudflare Edge)
            const response = await fetch('https://speed.cloudflare.com/meta');
            const data = await response.json();

            const geo = {
                lat: data.latitude,
                lng: data.longitude,
                city: (data.city || "ORIGIN").toUpperCase(),
                country: data.country || null,
                clientId: RAU_SESSION_KEY
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_SESSION_KEY });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `FIXADO NO HARDWARE: ${geo.city}`;
                
                // Entramos na presença. O Ably remove sessões antigas com o mesmo clientId.
                channel.presence.enter(geo);

                const updateWorld = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Filtro de segurança: Garantir unicidade absoluta por ID
                            const activeMembers = [];
                            const seen = new Set();
                            members.forEach(m => {
                                if (!seen.has(m.clientId)) {
                                    activeMembers.push(m.data);
                                    seen.add(m.clientId);
                                }
                            });

                            document.getElementById('count').innerText = activeMembers.length;
                            world.htmlElementsData(activeMembers);
                        }
                    });
                };

                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], updateWorld);
                updateWorld();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.8 }, 2000);
        } catch (e) {
            document.getElementById('status').innerText = "ERRO NA REDE DE PRECISÃO";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    syncSystem();
</script>
</body>
</html>
