<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; color: #fff; padding: 5px; display: flex; justify-content: center; }
        
        /* DESIGN ORIGINAL 440px */
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(15, 0, 0, 0.98); 
            border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; }
        
        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; overflow: hidden; }

        .header { padding: 12px; background: rgba(120, 0, 0, 0.3); border-bottom: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; }
        
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #fff; border: 1px solid #fff; min-width: 60px; text-align: center; }

        /* LISTA COM SCROLL VERTICAL 5s */
        .location-list-wrapper { height: 50px; overflow: hidden; background: #050000; border-top: 1px solid #300; }
        .location-list { display: flex; flex-direction: column; transition: transform 0.8s ease-in-out; }
        
        .location-item { 
            height: 50px; padding: 0 15px; background: rgba(255,0,0,0.1); 
            border-left: 4px solid #f00; display: flex; align-items: center; 
            gap: 12px; font-size: 13px; text-transform: uppercase; font-weight: bold; flex-shrink: 0;
        }
        .location-item img { width: 25px; border-radius: 2px; }

        /* ETIQUETAS CENTRALIZADAS NO GLOBO */
        .location-tag {
            position: absolute; color: #ffffff; font-size: 11px; font-weight: bold;
            text-transform: uppercase; pointer-events: none; display: none;
            align-items: center; gap: 6px; white-space: nowrap;
            text-shadow: 2px 2px 4px #000;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        .location-tag img { width: 18px; border-radius: 2px; }

        #date { font-size: 12px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"></div>
    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>
    <div class="location-list-wrapper">
        <div class="location-list" id="locationData"></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 5);

    // Three.js Setup
    const container = document.getElementById('canvas-globe');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    container.appendChild(renderer.domElement);

    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
        })
    );
    globeGroup.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    camera.position.z = 3.2;

    let markers = [];
    let currentIndex = 0;

    // Converte Lat/Lng para Vector3 relativo ao globo
    function latLngToVec(lat, lng) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(
            -1.01 * Math.sin(phi) * Math.cos(theta),
             1.01 * Math.cos(phi),
             1.01 * Math.sin(phi) * Math.sin(theta)
        );
    }

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myData = {
                id: SESSION_ID,
                city: d.city || "Local",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude, lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-radar-v9');

            channel.presence.enter(myData);
            channel.presence.subscribe(() => {
                channel.presence.get((err, members) => {
                    if (err) return;
                    document.getElementById('visNum').innerText = members.length < 10 ? "0" + members.length : members.length;
                    
                    const list = document.getElementById("locationData");
                    list.innerHTML = "";
                    markers.forEach(m => { globeGroup.remove(m.dot); if(m.tag) m.tag.remove(); });
                    markers = [];

                    members.forEach(m => {
                        const u = m.data;
                        if (!u) return;

                        // Item da lista vertical
                        const div = document.createElement("div");
                        div.className = "location-item";
                        div.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city}</span>`;
                        list.appendChild(div);

                        // Marcador Verde e Tag
                        const pos = latLngToVec(u.lat, u.lng);
                        const dot = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 12), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
                        dot.position.copy(pos);
                        globeGroup.add(dot);

                        const tag = document.createElement('div');
                        tag.className = 'location-tag';
                        tag.innerHTML = `${u.city} <img src="https://flagcdn.com/w20/${u.code}.png">`;
                        container.appendChild(tag);
                        
                        markers.push({ dot, tag, pos: pos.clone() });
                    });
                });
            });
        } catch (e) { console.error(e); }
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.002;
        
        const widthHalf = 440 / 2;
        const heightHalf = 320 / 2;

        markers.forEach(m => {
            const vector = m.pos.clone().applyMatrix4(globeGroup.matrixWorld);
            const cameraDir = new THREE.Vector3().subVectors(camera.position, globeGroup.position).normalize();
            
            if(vector.dot(cameraDir) > 0.25) {
                vector.project(camera);
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(vector.x * widthHalf + widthHalf)}px`;
                m.tag.style.top = `${(-(vector.y * heightHalf) + heightHalf)}px`;
            } else { 
                m.tag.style.display = 'none'; 
            }
        });
        renderer.render(scene, camera);
    }

    // Scroll da lista a cada 5 segundos
    setInterval(() => {
        const track = document.getElementById('locationData');
        if (track.children.length > 1) {
            currentIndex = (currentIndex + 1) % track.children.length;
            track.style.transform = `translateY(-${currentIndex * 50}px)`;
        }
    }, 5000);

    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);

    initRadar();
    animate();

    // Bloqueios de segurança originais
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
</script>
</body>
</html>
