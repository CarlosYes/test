<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU SYSTEM v92</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; }
        
        /* CONTAINER PRINCIPAL RED (ESTILO SOLICITADO) */
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(15, 0, 0, 0.98); 
            border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.6); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; }
        
        #canvas-globe { width: 100%; height: 320px; background: #000; position: relative; overflow: hidden; }

        .header { padding: 12px; background: rgba(120, 0, 0, 0.3); border-bottom: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; }
        
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #fff; border: 1px solid #fff; min-width: 70px; text-align: center; }

        /* LISTA DE LOCALIZAÇÕES */
        .location-list { 
            max-height: 180px; 
            overflow-y: auto; 
            padding: 10px; 
            background: #050000; 
            border-top: 1px solid #300; 
        }
        
        .location-item { 
            padding: 8px; 
            background: rgba(255,0,0,0.1); 
            border-left: 4px solid #f00; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .location-item img { width: 25px; border-radius: 2px; }

        #date { font-size: 12px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase; }

        /* DESIGN DO GLOBO (XAT STYLE ADAPTADO) */
        .globe-sphere {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 240px; height: 240px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.4);
            border: 1px solid rgba(255, 0, 0, 0.3);
        }
        .map-layer {
            position: absolute; width: 200%; height: 100%;
            background: url('https://carlosyes.github.io/rauglobe1/img/map.png') repeat-x;
            background-size: contain;
            animation: rotate 30s linear infinite;
            opacity: 0.7; filter: drop-shadow(0 0 5px #f00);
        }
        .light-mask {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.15) 0%, transparent 50%, rgba(0,0,0,0.8) 100%);
            z-index: 5;
        }

        @keyframes rotate { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-globe">
        <div class="globe-sphere">
            <div class="map-layer"></div>
            <div class="light-mask"></div>
        </div>
    </div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    // CONFIGURAÇÃO ABLY (TEUS DADOS)
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);
    
    // RELÓGIO E DATA
    function updateClock() {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // MOTOR DE LOCALIZAÇÃO E ABLY
    async function startSystem() {
        try {
            const response = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await response.json();
            
            const geo = {
                city: d.city || d.locality || "Desconhecido",
                country: d.countryName || "Mundo",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude,
                lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);

                // ESCUTAR MUDANÇAS NA LISTA
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Atualizar Contador (Formato 00)
                            let total = members.length;
                            document.getElementById('visNum').innerText = total < 10 ? "0" + total : total;

                            // Atualizar Lista Visual
                            const list = document.getElementById("locationData");
                            list.innerHTML = "";
                            members.forEach(member => {
                                const u = member.data;
                                if (u && u.city) {
                                    const div = document.createElement("div");
                                    div.className = "location-item";
                                    div.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city} - ${u.country}</span>`;
                                    list.appendChild(div);
                                }
                            });
                        }
                    });
                });
            });

        } catch(e) { console.error("Erro no Radar"); }
    }

    startSystem();

    // SEGURANÇA MÁXIMA
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (e.ctrlKey && (e.key === 'u' || e.key === 'i' || e.key === 'j' || e.key === 's')) e.preventDefault();
        if (e.key === 'F12') e.preventDefault();
    });
</script>
</body>
</html>
