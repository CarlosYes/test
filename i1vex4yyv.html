<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v182 - HYBRID TITAN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
        
        /* HUD Estilo Player Integrado v182 */
        .player-hud {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 550px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(57, 255, 20, 0.4);
            border-radius: 10px; padding: 15px 25px;
            display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(12px); z-index: 1000;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 15px rgba(57, 255, 20, 0.1);
        }

        .info-group { display: flex; align-items: center; gap: 18px; }
        .status-led { width: 10px; height: 10px; background: #39ff14; border-radius: 50%; animation: pulse 1.5s infinite; }
        .display-text { display: flex; flex-direction: column; }
        .city-title { color: #fff; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .sub-text { color: #39ff14; font-size: 10px; font-family: monospace; margin-top: 2px; opacity: 0.8; }
        
        .live-tag { background: #39ff14; color: #000; padding: 4px 12px; border-radius: 4px; font-weight: 900; font-size: 13px; display: flex; align-items: center; gap: 5px; }

        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(57, 255, 20, 0); } 100% { box-shadow: 0 0 0 0 rgba(57, 255, 20, 0); } }

        /* Marcadores de Satélite */
        .m-rau { pointer-events: none; display: flex; flex-direction: column; align-items: center; }
        .l-rau { 
            background: rgba(0, 0, 0, 0.9); color: #fff; padding: 3px 8px; border: 1px solid #39ff14; 
            border-radius: 3px; font-size: 10px; font-weight: bold; display: flex; align-items: center; gap: 5px;
        }
        .l-rau img { width: 16px; height: 11px; border-radius: 1px; }
        .d-rau { width: 10px; height: 10px; background: #fff; border-radius: 50%; margin-top: 4px; box-shadow: 0 0 10px #39ff14; border: 1px solid #39ff14; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="player-hud">
    <div class="info-group">
        <div class="status-led" id="led"></div>
        <div class="display-text">
            <div id="city" class="city-title">SCANNING...</div>
            <div id="meta" class="sub-text">INITIATING EXTREME TRACE</div>
        </div>
    </div>
    <div class="live-tag">RADAR: <span id="count">0</span></div>
</div>

<script>
    const SESSION_ID = 'RAU-HYBRID-' + Math.random().toString(36).substr(2, 7);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    // Configuração de movimento cinético
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;

    async function startExtremeEngine() {
        try {
            // MOTOR v92: BigDataCloud para precisão de localidade (bypass de sede)
            const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
            const d = await response.json();
            
            if (d.latitude) {
                const geo = {
                    lat: d.latitude,
                    lng: d.longitude,
                    city: (d.city || d.locality || "DETECTION").toUpperCase(),
                    country: d.countryCode ? d.countryCode.toLowerCase() : 'be'
                };

                document.getElementById('city').innerText = geo.city;
                document.getElementById('meta').innerText = `PRECISION: LOCALITY-LEVEL | ISP: BYPASSED`;
                document.getElementById('led').style.background = "#39ff14";

                const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
                const channel = ably.channels.get('rau-live-radar');

                ably.connection.on('connected', () => {
                    channel.presence.enter(geo);
                    const sync = () => {
                        channel.presence.get((err, members) => {
                            if (!err) {
                                const nodes = members.map(m => m.data).filter(x => x && x.lat);
                                document.getElementById('count').innerText = nodes.length;
                                world.htmlElementsData(nodes);
                            }
                        });
                    };
                    channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                    sync();
                });

                // Voo orbital para o ponto detetado
                setTimeout(() => {
                    world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.8 }, 2500);
                }, 800);
            }
        } catch (e) {
            document.getElementById('city').innerText = "LINK ERROR";
            document.getElementById('led').style.background = "#ff3131";
        }
    }

    startExtremeEngine();
</script>
</body>
</html>
