<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - GLOBO REAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: #000; overflow: hidden; height: 100vh; 
            display: flex; justify-content: center; align-items: center;
        }
        
        /* Estrelas Fixas no Fundo */
        #starfield {
            position: fixed; width: 100%; height: 100%;
            background: #000 url('https://www.transparenttextures.com/patterns/stardust.png');
            z-index: 0; opacity: 0.4;
        }

        .main-container {
            width: 100%; max-width: 500px; height: 95vh;
            background: rgba(0,0,0,0.9); border: 2px solid #ff0000; border-radius: 25px;
            position: relative; display: flex; flex-direction: column; overflow: hidden;
            z-index: 10; box-shadow: 0 0 50px rgba(255, 0, 0, 0.5);
        }

        #globeViz { flex-grow: 1; width: 100%; z-index: 5; }

        .header {
            position: absolute; top: 0; width: 100%; z-index: 1000;
            padding: 20px; text-align: center; pointer-events: none;
        }
        .title { color: #ff0000; font-family: sans-serif; font-weight: bold; font-size: 24px; letter-spacing: 4px; }
        #status { color: #39ff14; font-size: 10px; font-family: monospace; margin-top: 5px; }

        .footer {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            background: #000; border-top: 2px solid #ff0000; z-index: 1000;
        }
        .vis-pill { 
            background: #ff0000; color: #fff; padding: 10px 20px; border-radius: 10px; 
            font-weight: bold; font-family: monospace; font-size: 20px;
        }
        #time { color: #fff; font-family: monospace; font-size: 18px; }

        .m-tag { 
            background: rgba(0,0,0,0.9); border: 1px solid #f00; padding: 4px 8px;
            color: #fff; font-size: 11px; border-radius: 4px; display: flex; align-items: center; gap: 5px;
        }
    </style>
</head>
<body>

<div id="starfield"></div>

<div class="main-container">
    <div class="header">
        <div class="title">RADAR GLOBO</div>
        <div id="status">INICIALIZANDO SATÉLITE...</div>
    </div>

    <div id="globeViz"></div>

    <div class="footer">
        <div id="time">00:00:00</div>
        <div class="vis-pill">LIVE: <span id="count">00</span></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    let world, ably, channel;

    // 1. CRIAR O GLOBO IMEDIATAMENTE (Sem depender de GPS)
    world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('rgba(0,0,0,0)')
        .showAtmosphere(true)
        .atmosphereColor('#ff0000')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="m-tag">${d.city}</div>
                    <div style="width:12px; height:12px; background:#f00; border-radius:50%; border:2px solid #fff; box-shadow:0 0 15px #f00;"></div>
                </div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // 2. CONECTAR À REDE REAL
    async function startSystem() {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'RADAR-' + Math.random().toString(36).substr(2, 5) });
        channel = ably.channels.get('malajes-live');

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (!err) {
                    document.getElementById('count').innerText = members.length.toString().padStart(2, '0');
                    world.htmlElementsData(members.map(m => m.data));
                }
            });
        });

        // 3. LOCALIZAÇÃO REAL SEM CIDADES "HARDCODED"
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const lat = pos.coords.latitude;
                const lng = pos.coords.longitude;
                let cityName = "EU";

                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
                    const json = await res.json();
                    cityName = (json.address.city || json.address.town || "LOCALIZADO").toUpperCase();
                } catch(e) {}

                document.getElementById('status').innerText = "SINAL GPS CONFIRMADO: " + cityName;
                channel.presence.enter({ lat, lng, city: cityName });
                world.pointOfView({ lat, lng, altitude: 2 }, 2000);

            }, () => {
                document.getElementById('status').innerText = "GPS BLOQUEADO PELO NAVEGADOR";
                document.getElementById('status').style.color = "yellow";
                // Apenas um ponto de referência se o GPS falhar totalmente
                channel.presence.enter({ lat: 51.2093, lng: 3.2247, city: "GPS OFF" });
            }, { enableHighAccuracy: true });
        }
    }

    setInterval(() => {
        document.getElementById('time').innerText = new Date().toLocaleTimeString('pt-PT');
    }, 1000);

    startSystem();
</script>
</body>
</html>
