<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR - PRECISÃO REAL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS3DRenderer.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: transparent; display: flex; justify-content: center; padding: 5px; overflow: hidden; }
        
        .container { 
            width: 440px; background: #000; border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.8); display: flex; flex-direction: column; position: relative;
        }

        .title { font-size: 22px; text-align: center; font-weight: 900; color: #ff0000; padding: 12px; text-shadow: 0 0 15px #ff0000; letter-spacing: 3px; }
        #canvas-globe { width: 100%; height: 320px; background: #000; cursor: grab; position: relative; }
        #css3d-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        .header { 
            padding: 12px 20px; background: rgba(150, 0, 0, 0.3); 
            border-top: 1px solid #ff0000; border-bottom: 1px solid #ff0000;
            display: flex; justify-content: space-between; align-items: center; 
        }
        .live-indicator { font-size: 20px; font-weight: 900; color: #00ff00; text-shadow: 0 0 10px #00ff00; }
        #time { font-size: 20px; font-weight: bold; color: #fff; font-family: monospace; }

        .location-list-wrapper { height: 50px; overflow: hidden; background: #050000; }
        .location-list { display: flex; flex-direction: column; transition: transform 0.8s ease-in-out; }
        .location-item { height: 50px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; text-transform: uppercase; font-weight: bold; color: #fff; }

        /* ETIQUETA VERMELHO RELUZENTE */
        .globe-label {
            display: flex; align-items: center; gap: 10px; padding: 10px 18px;
            background: rgba(0, 0, 0, 0.85); border-radius: 25px; border: 2px solid #ff0000;
            box-shadow: 0 0 25px #ff0000; backface-visibility: hidden;
        }
        .globe-label span {
            color: #ff3333; font-weight: 900; font-size: 20px; text-transform: uppercase;
            text-shadow: 0 0 12px #ff0000, 0 0 20px #ff0000; white-space: nowrap;
        }
        .dot-marker { width: 12px; height: 12px; background: #00ff00; border-radius: 50%; box-shadow: 0 0 12px #00ff00; }
    </style>
</head>
<body>

<div class="container">
    <div class="title">🎧 RAU RADAR 🎶</div>
    <div id="canvas-globe"><div id="css3d-layer"></div></div>
    <div class="header">
        <div class="live-indicator">LIVE: <span id="visNum">--</span></div>
        <span id="time">00:00:00</span>
    </div>
    <div class="location-list-wrapper">
        <div class="location-list" id="locationData"></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 5);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, 440 / 320, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(440, 320);
    document.getElementById('canvas-globe').appendChild(renderer.domElement);

    const css3dScene = new THREE.Scene();
    const css3dRenderer = new THREE.CSS3DRenderer();
    css3dRenderer.setSize(440, 320);
    document.getElementById('css3d-layer').appendChild(css3dRenderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);

    const earth = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg') })
    );
    globeGroup.add(earth);
    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    camera.position.set(2.4, 1.2, 2.0);

    let activeMarkers = new Map();

    async function initRadar(lat, lng, city = "Singapore", code = "sg") {
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('radar-global-v50');
        
        channel.presence.enter({ city, code, lat, lng });

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                if (err) return;
                document.getElementById('visNum').innerText = members.length.toString().padStart(2, '0');
                const list = document.getElementById("locationData");
                list.innerHTML = "";
                activeMarkers.forEach(m => css3dScene.remove(m.label));
                activeMarkers.clear();

                members.forEach(m => {
                    const u = m.data; if(!u || !u.lat) return;
                    const item = document.createElement("div");
                    item.className = "location-item";
                    item.innerHTML = `<span>${u.city}</span>`;
                    list.appendChild(item);

                    const div = document.createElement('div');
                    div.className = 'globe-label';
                    div.innerHTML = `<div class="dot-marker"></div><span>${u.city}</span>`;
                    const label = new THREE.CSS3DSprite(div);
                    label.scale.set(0.0022, 0.0022, 0.0022);
                    
                    const phi = (90 - u.lat) * (Math.PI / 180);
                    const theta = (u.lng + 180) * (Math.PI / 180);
                    label.position.set(-1.05 * Math.sin(phi) * Math.cos(theta), 1.05 * Math.cos(phi), 1.05 * Math.sin(phi) * Math.sin(theta));
                    
                    css3dScene.add(label);
                    activeMarkers.set(m.clientId, {label});
                });
            });
        });
    }

    // TENTA LOCALIZAÇÃO REAL VIA GPS/NAVEGADOR
    if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
            (pos) => initRadar(pos.coords.latitude, pos.coords.longitude, "Singapura", "sg"),
            async () => {
                // Fallback forçado se o GPS for negado
                const res = await fetch("http://ip-api.com/json/");
                const d = await res.json();
                initRadar(d.lat, d.lon, d.city, d.countryCode.toLowerCase());
            }
        );
    }

    function animate() {
        requestAnimationFrame(animate);
        globeGroup.rotation.y += 0.006; // VELOCIDADE AUMENTADA
        css3dScene.rotation.y = globeGroup.rotation.y;
        controls.update();
        renderer.render(scene, camera);
        css3dRenderer.render(css3dScene, camera);
    }

    setInterval(() => {
        const track = document.getElementById('locationData');
        if (track.children.length > 1) {
            const idx = Math.floor(Date.now()/5000) % track.children.length;
            track.style.transform = `translateY(-${idx * 50}px)`;
        }
    }, 1000);

    setInterval(() => { document.getElementById('time').textContent = new Date().toLocaleTimeString('pt-PT', { hour12: false }); }, 1000);
    animate();
</script>
</body>
</html>
