<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - TICKER EDITION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(10, 0, 0, 0.98); 
            border-radius: 15px; border: 2.5px solid #ff0000; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.7); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; border-bottom: 2px solid rgba(255,0,0,0.3); }
        
        #canvas-container { width: 100%; height: 350px; background: #000; position: relative; cursor: grab; overflow: hidden; }

        /* --- TICKER (O GIRO NO FUNDO DO GLOBO) --- */
        .ticker-wrap {
            position: absolute; bottom: 0; width: 100%;
            background: rgba(255, 0, 0, 0.15);
            border-top: 1px solid rgba(255, 0, 0, 0.5);
            backdrop-filter: blur(5px); height: 35px;
            overflow: hidden; white-space: nowrap;
            display: flex; align-items: center;
        }

        .ticker-move {
            display: inline-block;
            white-space: nowrap;
            padding-right: 100%;
            animation: ticker 25s linear infinite;
        }

        .ticker-item {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 0 25px; color: #fff; font-size: 12px;
            font-weight: 900; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .ticker-item img { width: 20px; border-radius: 2px; }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* ETIQUETAS E PONTOS NO GLOBO */
        .location-tag { position: absolute; pointer-events: none; z-index: 100; display: flex; flex-direction: column; align-items: center; transform: translate(-50%, -50%); }
        .user-point-mini { width: 6px; height: 6px; background: #00ff00; border-radius: 50%; border: 1px solid #fff; box-shadow: 0 0 8px #00ff00; animation: pulse 1.5s infinite; }
        .tag-info { margin-bottom: 8px; display: flex; align-items: center; gap: 4px; background: rgba(0, 0, 0, 0.8); border: 1px solid rgba(255, 255, 255, 0.3); padding: 2px 5px; border-radius: 3px; font-size: 9px; font-weight: bold; white-space: nowrap; text-transform: uppercase; }
        .tag-info img { width: 12px; }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }

        /* INTERFACE INFERIOR */
        .header { padding: 12px; background: rgba(150, 0, 0, 0.2); border-top: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; font-family: monospace; }
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: 900; border: 2px solid #fff; }

        .location-list { max-height: 120px; overflow-y: auto; padding: 10px; background: #050000; border-top: 2px solid #300; }
        .location-item { padding: 8px; background: rgba(255,0,0,0.05); border-left: 4px solid #f00; border-radius: 4px; display: flex; align-items: center; margin-bottom: 6px; font-size: 11px; text-transform: uppercase; font-weight: bold; }
        .location-item img { width: 18px; margin-right: 10px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .online { background: #00ff00; box-shadow: 0 0 8px #00ff00; }
        .offline { background: #440000; }

        #date { font-size: 11px; margin-top: 4px; color: #ffaaaa; text-transform: uppercase; }
        .location-list::-webkit-scrollbar { width: 5px; }
        .location-list::-webkit-scrollbar-thumb { background: #f00; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-container">
        <div class="ticker-wrap">
            <div class="ticker-move" id="tickerContent">
                <span class="ticker-item">A AGUARDAR LIGAÇÕES...</span>
            </div>
        </div>
    </div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.minDistance = 1.6;
    controls.maxDistance = 5.0;

    const globe = new THREE.Mesh(
        new THREE.SphereGeometry(1, 64, 64),
        new THREE.MeshPhongMaterial({ 
            map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg'),
            shininess: 15
        })
    );
    scene.add(globe);

    globe.rotation.y = -Math.PI / 1.5; 
    camera.position.set(0, 0.8, 2.8); 
    controls.update();

    scene.add(new THREE.AmbientLight(0xffffff, 1.3));
    const sun = new THREE.DirectionalLight(0xffffff, 0.6);
    sun.position.set(5, 3, 5);
    scene.add(sun);

    let markers = [];
    let historyUsers = new Map();

    function latLngToVector3(lat, lng) {
        const phi = (90 - lat) * (Math.PI / 180);
        const theta = (lng + 180) * (Math.PI / 180);
        return new THREE.Vector3(-Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
    }

    function animate() {
        requestAnimationFrame(animate);
        if (!controls.active) globe.rotation.y += 0.002;
        
        markers.forEach(m => {
            const pos = m.vector.clone().applyQuaternion(globe.quaternion);
            const vector = pos.clone().project(camera);
            const isVisible = pos.angleTo(camera.position) < Math.PI/2.1;
            
            if(isVisible) {
                m.tag.style.display = 'flex';
                m.tag.style.left = `${(vector.x * 0.5 + 0.5) * container.clientWidth}px`;
                m.tag.style.top = `${(vector.y * -0.5 + 0.5) * container.clientHeight}px`;
                const dist = camera.position.length();
                m.tag.style.transform = `translate(-50%, -50%) scale(${Math.max(0.6, 2.8/dist)})`;
            } else {
                m.tag.style.display = 'none';
            }
        });

        controls.update();
        renderer.render(scene, camera);
    }
    animate();

    async function initRadar() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            const myGeo = {
                id: SESSION_ID,
                city: (d.city || d.locality || "GPS").toUpperCase(),
                country: d.countryName || "Mundo",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude, lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(myGeo);
                channel.presence.subscribe(() => {
                    channel.presence.get((err, members) => {
                        if (err) return;
                        document.getElementById('visNum').innerText = members.length < 10 ? "0" + members.length : members.length;
                        
                        historyUsers.forEach(u => u.online = false);
                        members.forEach(m => {
                            const u = m.data;
                            if(u && u.id) historyUsers.set(u.id, { ...u, online: true });
                        });

                        markers.forEach(m => m.tag.remove());
                        markers = [];
                        const list = document.getElementById("locationData");
                        const ticker = document.getElementById("tickerContent");
                        list.innerHTML = "";
                        ticker.innerHTML = "";

                        Array.from(historyUsers.values()).reverse().forEach(u => {
                            // Lista Inferior
                            const item = document.createElement("div");
                            item.className = "location-item";
                            item.innerHTML = `<span class="status-dot ${u.online?'online':'offline'}"></span><img src="https://flagcdn.com/w40/${u.code}.png"><span>${u.city} - ${u.country}</span>`;
                            list.appendChild(item);

                            if(u.online) {
                                // Ticker (Scroll no fundo do globo)
                                const tickItem = document.createElement("span");
                                tickItem.className = "ticker-item";
                                tickItem.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> ${u.city}`;
                                ticker.appendChild(tickItem);

                                // Marcador no Globo
                                const tag = document.createElement('div');
                                tag.className = 'location-tag';
                                tag.innerHTML = `<div class="tag-info"><img src="https://flagcdn.com/w20/${u.code}.png"><span>${u.city}</span></div><div class="user-point-mini"></div>`;
                                container.appendChild(tag);
                                markers.push({ tag, vector: latLngToVector3(u.lat, u.lng) });
                            }
                        });
                        
                        // Duplicar conteúdo do ticker para scroll infinito suave se houver muitos
                        if(ticker.children.length > 0) {
                            ticker.innerHTML += ticker.innerHTML;
                        } else {
                            ticker.innerHTML = '<span class="ticker-item">RADAR ATIVO</span>';
                        }
                    });
                });
            });
        } catch(e) { console.error(e); }
    }

    setInterval(() => {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }, 1000);

    initRadar();
</script>
</body>
</html>
