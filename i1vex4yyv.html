<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAU RADAR - REAL PRECISION</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        .container { 
            width: 100%; max-width: 500px; height: 95vh;
            background: #000; border: 2px solid #ff0000; border-radius: 20px;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.5); position: relative;
        }

        .header { 
            position: absolute; top: 0; width: 100%; padding: 15px; 
            text-align: center; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,1), transparent);
        }
        .title { color: #ff0000; font-weight: bold; letter-spacing: 3px; text-shadow: 0 0 10px #f00; }

        #globeViz { flex: 1; }

        .footer { 
            position: absolute; bottom: 0; width: 100%; padding: 20px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 10; background: linear-gradient(to top, rgba(0,0,0,1), transparent);
        }
        .vis-pill { background: #ff0000; color: #fff; padding: 8px 20px; border-radius: 30px; font-weight: bold; border: 1px solid #fff; }
        #time { color: #fff; font-weight: bold; font-size: 18px; }

        .m-tag { 
            background: rgba(0,0,0,0.9); border: 1px solid #ff0000; padding: 5px 10px;
            color: #fff; font-size: 12px; border-radius: 4px; font-weight: bold;
            display: flex; align-items: center; gap: 6px; box-shadow: 0 0 15px #f00;
        }
    </style>
</head>
<body oncontextmenu="return false">

<div class="container">
    <div class="header">
        <div class="title">RADAR EM TEMPO REAL</div>
        <div id="status" style="color: #39ff14; font-size: 10px; margin-top: 5px;">A AGUARDAR GPS...</div>
    </div>

    <div id="globeViz"></div>

    <div class="footer">
        <div id="time">00:00:00</div>
        <div class="vis-pill">LIVE: <span id="count">00</span></div>
    </div>
</div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    let ably, channel;
    
    // Objeto vazio para forçar a detecção real
    let myData = { lat: 0, lng: 0, city: "A LOCALIZAR...", country: "be" };

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#ff0000')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.innerHTML = `
                <div style="display:flex; flex-direction:column; align-items:center;">
                    <div class="m-tag">
                        <img src="https://flagcdn.com/w20/${d.country.toLowerCase()}.png" width="16"> 
                        <span>${d.city}</span>
                    </div>
                    <div style="width:12px; height:12px; background:#f00; border-radius:50%; box-shadow:0 0 20px #f00; border:2px solid #fff; margin-top:5px;"></div>
                </div>`;
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;

    // Estrelas Fixas (Não giram com a terra)
    const scene = world.scene();
    const starGeo = new THREE.BufferGeometry();
    const starCoords = [];
    for (let i = 0; i < 10000; i++) {
        starCoords.push(THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000), THREE.MathUtils.randFloatSpread(4000));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starCoords, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.8, transparent: true, opacity: 0.8 })));

    async function startLiveRadar() {
        ably = new Ably.Realtime({ key: ABLY_KEY, clientId: 'R-' + Math.random().toString(36).substr(2, 5) });
        channel = ably.channels.get('malajes-live');

        channel.presence.subscribe(() => {
            channel.presence.get((err, members) => {
                const pts = members.map(m => m.data);
                document.getElementById('count').innerText = pts.length.toString().padStart(2, '0');
                world.htmlElementsData(pts);
            });
        });

        // --- O CORAÇÃO DO SISTEMA: GPS REAL ---
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                myData.lat = pos.coords.latitude;
                myData.lng = pos.coords.longitude;

                // Busca o nome real da cidade pelas coordenadas exatas
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${myData.lat}&lon=${myData.lng}`);
                    const json = await response.json();
                    myData.city = (json.address.city || json.address.town || json.address.village || "LOCALIZAÇÃO ATIVA").toUpperCase();
                    myData.country = json.address.country_code;
                    document.getElementById('status').innerText = "SINAL GPS: " + myData.city;
                } catch(e) { myData.city = "RADAR ATIVO"; }

                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 1.5 }, 2500);

            }, async (error) => {
                // Se o GPS for bloqueado, usamos o IP como última esperança
                document.getElementById('status').innerText = "GPS BLOQUEADO. USANDO IP (MENOS PRECISO)";
                const res = await fetch('https://ipapi.co/json/');
                const d = await res.json();
                myData = { lat: d.latitude, lng: d.longitude, city: d.city.toUpperCase(), country: d.country_code.toLowerCase() };
                channel.presence.enter(myData);
                world.pointOfView({ lat: myData.lat, lng: myData.lng, altitude: 2 }, 2000);
            }, { 
                enableHighAccuracy: true, // FORÇA O GPS
                timeout: 10000, 
                maximumAge: 0 
            });
        }
    }

    setInterval(() => { document.getElementById('time').innerText = new Date().toLocaleTimeString(); }, 1000);
    startLiveRadar();
</script>
</body>
</html>
