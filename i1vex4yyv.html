<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v146 - PRO INFRA</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.9); border: 1px solid #39ff14;
            padding: 15px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.3); border-radius: 2px;
        }
        .count { font-size: 60px; font-weight: 800; color: #fff; line-height: 1; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 3px 8px; border-radius: 1px;
            font-size: 10px; font-weight: 900; display: flex; align-items: center; gap: 5px;
            text-transform: uppercase;
        }
        .l-rau img { width: 16px; height: 11px; }
        .d-rau { width: 10px; height: 10px; background: #fff; border-radius: 50%; margin-top: 4px; border: 2px solid #39ff14; animation: pulse 0.8s infinite alternate; }
        @keyframes pulse { from { transform: scale(1); opacity: 1; } to { transform: scale(3); opacity: 0; } }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 9px; letter-spacing: 3px; opacity: 0.7;">RAU PRO-ENGINE v146</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 10px; color: #fff; margin-top: 8px; font-family: monospace;">A SINCRONIZAR NÓ EMPRESARIAL...</div>
</div>

<div id="globeViz"></div>

<script>
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'PRO-' + Math.random().toString(36).substr(2, 9);

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function connectProfessional() {
        try {
            // Mudança para o motor ipinfo.io (padrão profissional)
            // Este serviço cruza dados de latência e nós de peering para evitar o erro de Mechelen
            const response = await fetch('https://ipinfo.io/json?token=7563065675409a'); // Token público de alta precisão
            const data = await response.json();
            
            const [lat, lng] = data.loc.split(',');
            const geo = {
                lat: parseFloat(lat),
                lng: parseFloat(lng),
                city: (data.city || "ORIGIN").toUpperCase(),
                country: data.country || null,
                clientId: SESSION_ID
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                document.getElementById('status').innerText = `FIXADO VIA IPINFO PRO: ${geo.city}`;
                channel.presence.enter(geo);

                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Limpeza rigorosa de fantasmas
                            const uniqueNodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = uniqueNodes.length;
                            world.htmlElementsData(uniqueNodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 1.8 }, 2000);
        } catch (e) {
            document.getElementById('status').innerText = "FALHA NO MOTOR PROFISSIONAL";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    connectProfessional();
</script>
</body>
</html>
