<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <script src="https://unpkg.com/three"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        #radar-box {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0, 30, 0, 0.9); color: #00ff00;
            padding: 15px; border: 2px solid #00ff00;
            z-index: 1000; font-size: 18px; font-weight: bold;
            box-shadow: 0 0 15px #00ff00; border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="radar-box">SISTEMA: A LIGAR...</div>
    <div id="globeViz"></div>

    <script>
        const world = Globe()(document.getElementById('globeViz'))
            .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg')
            .backgroundColor('#000000')
            .showAtmosphere(true)
            .atmosphereColor('#00ff00');

        async function carregar() {
            try {
                // Forçamos o fetch para o TEU worker sem cache
                const res = await fetch('https://globorau.carlos2022yes.workers.dev/?t=' + Date.now());
                const d = await res.json();
                
                const local = `${d.flag} ${d.city.toUpperCase()}`;
                document.getElementById('radar-box').innerHTML = `LOCALIZADO: ${local}`;

                // O PONTO VERDE COM O NOME
                world.labelsData([{ lat: d.latitude, lng: d.longitude, text: local }])
                    .labelColor(() => '#00ff00')
                    .labelSize(3)
                    .labelDotRadius(0.8);

                world.ringsData([{ lat: d.latitude, lng: d.longitude }])
                    .ringColor(() => '#00ff00')
                    .ringMaxRadius(6);

                world.pointOfView({ lat: d.latitude, lng: d.longitude, altitude: 2 }, 2000);
            } catch (e) {
                document.getElementById('radar-box').innerHTML = "ERRO DE CONEXÃO";
            }
        }
        carregar();
    </script>
</body>
</html>
