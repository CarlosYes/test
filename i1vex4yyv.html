<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v92 - EXTREME</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { 
            margin: 0; 
            background: #000; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
            user-select: none;
        }

        #globeViz { 
            width: 100vw; 
            height: 100vh; 
            position: absolute; 
        }

        /* Interface HUD */
        .hud {
            position: absolute; 
            top: 25px; 
            left: 25px; 
            z-index: 1000;
            background: rgba(0, 0, 0, 0.85); 
            border: 2px solid #39ff14;
            padding: 20px; 
            color: #39ff14; 
            pointer-events: none;
            box-shadow: 0 0 35px rgba(57, 255, 20, 0.3); 
            border-radius: 4px;
            backdrop-filter: blur(5px);
        }

        .count { 
            font-size: 80px; 
            font-weight: 900; 
            color: #fff; 
            line-height: 0.8; 
            letter-spacing: -5px; 
            margin: 5px 0;
        }

        /* Labels dos Visitantes no Globo */
        .m-rau { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .l-rau {
            background: #39ff14; 
            color: #000; 
            padding: 4px 10px; 
            border-radius: 2px;
            font-size: 10px; 
            font-weight: 900; 
            display: flex; 
            align-items: center; 
            gap: 6px;
            white-space: nowrap; 
            border: 1px solid #fff;
            box-shadow: 0 0 15px #39ff14;
        }

        .l-rau img { 
            width: 16px; 
            height: 11px; 
            object-fit: cover; 
        }

        .d-rau { 
            width: 10px; 
            height: 10px; 
            background: #fff; 
            border-radius: 50%; 
            margin-top: 5px; 
            border: 2px solid #39ff14; 
            animation: pulse 0.8s infinite alternate; 
        }

        @keyframes pulse { 
            from { transform: scale(1); opacity: 1; } 
            to { transform: scale(3); opacity: 0; } 
        }

        /* Camada Invisível de Segurança */
        .secure-shield {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            pointer-events: none; /* Permite girar o globo, mas protege o código */
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="secure-shield"></div>

<div class="hud">
    <div style="font-size: 10px; letter-spacing: 5px; opacity: 0.8;">SISTEMA OPERACIONAL</div>
    <div style="font-size: 14px; font-weight: bold;">RAU RADAR v92</div>
    <div id="count" class="count">00</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px; font-family: monospace; background: rgba(57, 255, 20, 0.2); padding: 2px 5px;">
        A LOCALIZAR SATÉLITE...
    </div>
</div>

<div id="globeViz"></div>

<script>
    // Configurações de Conexão (Chave do seu link original)
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    // Inicialização do Globo
    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .bumpImageUrl('//unpkg.com/three-globe/example/img/earth-topology.png')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .atmosphereDaylightAlpha(0.1)
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            const flag = d.country ? `<img src="https://flagcdn.com/w40/${d.country.toLowerCase()}.png">` : '';
            el.innerHTML = `<div class="l-rau">${flag}<span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    // Função de Geolocalização de Precisão
    async function getExtremeLoc() {
        try {
            const response = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client');
            const d = await response.json();
            
            const geo = {
                lat: d.latitude || 0,
                lng: d.longitude || 0,
                city: (d.city || d.locality || "DESCONHECIDO").toUpperCase(),
                country: (d.countryCode || "UN").toLowerCase()
            };
            
            initAbly(geo);
        } catch (e) {
            document.getElementById('status').innerText = "ERRO DE SINCRONIZAÇÃO";
            // Fallback para coordenadas genéricas se falhar
            initAbly({ lat: 0, lng: 0, city: "OFFLINE", country: "un" });
        }
    }

    function initAbly(geo) {
        const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
        const channel = ably.channels.get('rau-live-radar');

        ably.connection.on('connected', () => {
            document.getElementById('status').innerText = `CONEXÃO FIXADA: ${geo.city}`;
            channel.presence.enter(geo);

            const updatePresence = () => {
                channel.presence.get((err, members) => {
                    if (!err) {
                        const nodes = members
                            .map(m => m.data)
                            .filter(x => x && typeof x.lat === 'number');
                        
                        document.getElementById('count').innerText = nodes.length.toString().padStart(2, '0');
                        world.htmlElementsData(nodes);
                    }
                });
            };

            channel.presence.subscribe(['enter', 'leave', 'present', 'update'], updatePresence);
            updatePresence();
        });

        // Focar a câmera na localização do usuário
        world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 2 }, 3000);
    }

    // Configurações de Controle e Rotação
    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.6;
    world.controls().enableDamping = true;

    // Iniciar rastreio
    getExtremeLoc();

    // Proteção de Código
    document.onkeydown = (e) => {
        if (e.ctrlKey && ['u', 'i', 'j', 's'].includes(e.key.toLowerCase())) return false;
        if (e.key === 'F12') return false;
    };
</script>
</body>
</html>
