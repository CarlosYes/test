<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RAU RADAR v200 - EURO TRACKER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: monospace; height: 100vh; width: 100vw; }
        #globeViz { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        .p-hud {
            position: absolute; top: 20px; left: 20px;
            background: rgba(0,0,0,0.8); border-left: 3px solid #39ff14;
            padding: 10px 15px; color: #fff; z-index: 1000;
            border-radius: 0 2px 2px 0; font-size: 18px; font-weight: bold;
            pointer-events: none; letter-spacing: 1px;
            box-shadow: 10px 0 20px rgba(0,0,0,0.5);
        }
        .live-label { color: #39ff14; }

        .m-rau { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        .m-tag { 
            display: flex; align-items: center; gap: 6px; 
            background: rgba(0, 0, 0, 0.9); padding: 4px 8px; 
            border: 1px solid #39ff14; border-radius: 2px; margin-bottom: 5px;
            box-shadow: 0 0 10px rgba(57, 255, 20, 0.3);
        }
        .m-flag { width: 18px; height: auto; border: 0.5px solid #555; }
        .m-city { color: #fff; font-size: 10px; font-weight: bold; text-transform: uppercase; }
        
        .dot-active { 
            width: 8px; height: 8px; background: #39ff14; border-radius: 50%; 
            box-shadow: 0 0 15px #39ff14; border: 1.5px solid #fff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 10px #39ff14; }
            50% { transform: scale(1.2); box-shadow: 0 0 20px #39ff14; }
            100% { transform: scale(1); box-shadow: 0 0 10px #39ff14; }
        }
        .dot-ghost { width: 4px; height: 4px; background: #440000; border-radius: 50%; opacity: 0.5; }
    </style>
</head>
<body>

<div id="globeViz"></div>

<div class="p-hud">
    RAU RADAR: <span id="count" class="live-label">0</span>
</div>

<script>
    const RAU_ID = 'STATIONARY-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const hour = new Date().getHours();
    const isNight = hour < 6 || hour > 18;
    const globeImg = isNight ? '//unpkg.com/three-globe/example/img/earth-night.jpg' : '//unpkg.com/three-globe/example/img/earth-blue-marble.jpg';

    let archive = new Map();

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl(globeImg)
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor(isNight ? '#39ff14' : '#87CEEB')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            if (d.status === 'active') {
                const c = (d.country || '??').toLowerCase();
                const flag = c !== '??' ? `<img src="https://flagcdn.com/w40/${c}.png" class="m-flag">` : '';
                el.innerHTML = `<div class="m-tag">${flag}<span class="m-city">${d.city}</span></div><div class="dot-active"></div>`;
            } else { el.innerHTML = `<div class="dot-ghost"></div>`; }
            return el;
        });

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.4;

    // FIRMAMENTO ESTÁTICO
    const scene = world.scene();
    const starsGeometry = new THREE.BufferGeometry();
    const starsVertices = [];
    for (let i = 0; i < 8000; i++) {
        const x = THREE.MathUtils.randFloatSpread(3000);
        const y = THREE.MathUtils.randFloatSpread(3000);
        const z = THREE.MathUtils.randFloatSpread(3000);
        if (Math.sqrt(x*x + y*y + z*z) > 400) starsVertices.push(x, y, z);
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
    
    const starsMat = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 0.7,
        transparent: true,
        opacity: 0.8
    });
    
    const starField = new THREE.Points(starsGeometry, starsMat);
    scene.add(starField);

    function animateStars() {
        const time = Date.now() * 0.001;
        const pulse = (Math.sin(time * (Math.PI * 2 / 15)) + 1) / 2;
        starsMat.opacity = 0.2 + (pulse * 0.8);
        requestAnimationFrame(animateStars);
    }
    animateStars();

    async function init() {
        try {
            const res = await fetch('https://speed.cloudflare.com/meta');
            const data = await res.json();
            const geo = {
                lat: data.latitude, 
                lng: data.longitude,
                city: data.city ? data.city.toUpperCase() : "EUROPE",
                country: data.country ? data.country.toLowerCase() : "be",
                status: 'active'
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);
                channel.presence.subscribe(msg => {
                    if (['enter', 'present', 'update'].includes(msg.action)) archive.set(msg.clientId, {...msg.data, status: 'active'});
                    else if (msg.action === 'leave') {
                        const p = archive.get(msg.clientId);
                        if (p) archive.set(msg.clientId, {...p, status: 'ghost'});
                    }
                    const nodes = Array.from(archive.values());
                    document.getElementById('count').innerText = nodes.filter(n => n.status === 'active').length;
                    world.htmlElementsData(nodes.filter(n => n.lat !== undefined));
                });
            });
            
            world.pointOfView({ lat: geo.lat, lng: geo.lng, altitude: 2 }, 2000);
        } catch (e) { console.warn("CONNECTION DELAY"); }
    }

    window.addEventListener('resize', () => {
        world.width(window.innerWidth);
        world.height(window.innerHeight);
    });

    init();
</script>
</body>
</html>
