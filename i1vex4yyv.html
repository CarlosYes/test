<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU RADAR v179 - TRUTH PROTOCOL</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/globe.gl"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Arial Black', sans-serif; }
        #globeViz { width: 100vw; height: 100vh; position: absolute; }
        .hud {
            position: absolute; top: 25px; left: 25px; z-index: 1000;
            background: rgba(0, 0, 0, 0.95); border: 2px solid #39ff14;
            padding: 20px; color: #39ff14; pointer-events: none;
            box-shadow: 0 0 35px #39ff1466; border-radius: 4px;
        }
        .count { font-size: 80px; font-weight: 900; color: #fff; line-height: 0.8; letter-spacing: -5px; }
        .m-rau { display: flex; flex-direction: column; align-items: center; }
        .l-rau {
            background: #39ff14; color: #000; padding: 4px 10px; border-radius: 2px;
            font-size: 11px; font-weight: 900; display: flex; align-items: center; gap: 6px;
            white-space: nowrap; border: 1px solid #fff;
        }
        .d-rau { width: 14px; height: 14px; background: #fff; border-radius: 50%; margin-top: 5px; border: 2px solid #39ff14; animation: p 0.5s infinite alternate; }
        @keyframes p { from { transform: scale(1); opacity: 1; } to { transform: scale(5); opacity: 0; } }
        #log { font-family: monospace; font-size: 10px; color: #ff3131; margin-top: 10px; }
    </style>
</head>
<body>

<div class="hud">
    <div style="font-size: 9px; letter-spacing: 5px; opacity: 0.7;">RAU SYSTEM v179</div>
    <div id="count" class="count">0</div>
    <div id="status" style="font-size: 11px; color: #fff; margin-top: 10px;">A AGUARDAR DADOS REAIS...</div>
    <div id="log"></div>
</div>

<div id="globeViz"></div>

<script>
    const RAU_ID = 'TRUTH-' + Math.random().toString(36).substr(2, 5);
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';

    const world = Globe()(document.getElementById('globeViz'))
        .globeImageUrl('//unpkg.com/three-globe/example/img/earth-night.jpg')
        .backgroundColor('#000000')
        .showAtmosphere(true)
        .atmosphereColor('#39ff14')
        .htmlElement(d => {
            const el = document.createElement('div');
            el.className = 'm-rau';
            el.innerHTML = `<div class="l-rau"><span>${d.city}</span></div><div class="d-rau"></div>`;
            return el;
        });

    async function startSystem() {
        let geoData = null;

        // 1. Tentar Hardware (GPS/WiFi do Browser)
        try {
            const pos = await new Promise((res, rej) => {
                navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 5000 });
            });
            const rev = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`);
            const data = await rev.json();
            geoData = {
                lat: pos.coords.latitude,
                lng: pos.coords.longitude,
                city: (data.address.city || data.address.town || "LOCAL-HARDWARE").toUpperCase()
            };
        } catch (e) {
            document.getElementById('log').innerText = "HARDWARE: FALHOU | ";
        }

        // 2. Tentar Rede (Só se o hardware falhar)
        if (!geoData) {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                if (data.latitude) {
                    geoData = {
                        lat: data.latitude,
                        lng: data.longitude,
                        city: data.city.toUpperCase()
                    };
                }
            } catch (e) {
                document.getElementById('log').innerText += "REDE: FALHOU";
            }
        }

        // 3. Resultado Final
        if (geoData) {
            document.getElementById('status').innerText = `DETECTADO: ${geoData.city}`;
            document.getElementById('log').style.color = "#39ff14";
            document.getElementById('log').innerText = "SINAL ESTABILIZADO";
            
            const payload = { ...geoData, clientId: RAU_ID };
            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: RAU_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(payload);
                const sync = () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            const nodes = Array.from(new Map(members.map(m => [m.clientId, m.data])).values());
                            document.getElementById('count').innerText = nodes.length;
                            world.htmlElementsData(nodes);
                        }
                    });
                };
                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], sync);
                sync();
            });

            world.pointOfView({ lat: geoData.lat, lng: geoData.lng, altitude: 1.5 }, 2000);
        } else {
            document.getElementById('status').innerText = "ERRO TOTAL: SEM ORIGEM DE DADOS";
            document.getElementById('log').innerText = "O SISTEMA RECUSA-SE A INVENTAR UMA LOCALIZAÇÃO.";
        }
    }

    world.controls().autoRotate = true;
    world.controls().autoRotateSpeed = 0.5;
    startSystem();
</script>
</body>
</html>
