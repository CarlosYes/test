<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAU SYSTEM v92 - REBORN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; padding: 10px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        /* CONTAINER PRINCIPAL ESTILO RAU */
        .container { 
            width: 100%; max-width: 440px; 
            background: rgba(15, 0, 0, 0.98); 
            border-radius: 15px; border: 2px solid #ff0000; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5); 
            overflow: hidden; position: relative;
            display: flex; flex-direction: column;
        }

        .title { font-size: 22px; text-align: center; font-weight: bold; color: #ff4444; padding: 12px; text-shadow: 2px 2px #000; letter-spacing: 2px; border-bottom: 1px solid rgba(255,0,0,0.2); }
        
        /* ÁREA ONDE O GLOBO APARECE */
        #canvas-globe { 
            width: 100%; height: 320px; 
            background: radial-gradient(circle at center, #1a0000 0%, #000 100%); 
            position: relative; 
            cursor: move;
        }

        .header { padding: 12px; background: rgba(120, 0, 0, 0.3); border-top: 1px solid rgba(255,0,0,0.4); text-align: center; }
        .info-row { display: flex; justify-content: center; align-items: center; gap: 20px; }
        #time { font-size: 22px; font-weight: bold; color: #fff; font-family: monospace; }
        
        .vis-pill { background: #ff0000; padding: 4px 15px; border-radius: 20px; font-size: 20px; font-weight: bold; color: #fff; border: 1px solid #fff; min-width: 70px; text-align: center; box-shadow: 0 0 10px #f00; }

        .location-list { 
            max-height: 150px; 
            overflow-y: auto; 
            padding: 10px; 
            background: #050000; 
            border-top: 1px solid #300; 
        }
        
        .location-item { 
            padding: 8px; 
            background: rgba(255,0,0,0.1); 
            border-left: 4px solid #f00; 
            border-radius: 4px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 8px;
            font-size: 13px;
            text-transform: uppercase;
            font-weight: bold;
        }
        .location-item img { width: 22px; border-radius: 2px; }

        #date { font-size: 11px; margin-top: 6px; color: #ffaaaa; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        /* Scrollbar Personalizada */
        .location-list::-webkit-scrollbar { width: 5px; }
        .location-list::-webkit-scrollbar-track { background: #000; }
        .location-list::-webkit-scrollbar-thumb { background: #f00; border-radius: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="title">🎧 RAU SYSTEM v92 🎶</div>
    
    <div id="canvas-globe"></div>

    <div class="header">
        <div class="info-row">
            <span id="time">00:00:00</span>
            <div class="vis-pill">👥 <span id="visNum">00</span></div>
        </div>
        <div id="date"></div>
    </div>

    <div class="location-list" id="locationData"></div>
</div>

<script>
    // DADOS DO TEU GLOBO E ABLY
    const ABLY_KEY = '0XXKIg.kPL-iw:5hRGSGvPZCgUwMNts43-74X7nB9_25r3YlD0s-WE7vs';
    const SESSION_ID = 'RAU-' + Math.random().toString(36).substr(2, 7);

    // --- CONFIGURAÇÃO DO GLOBO 3D (THREE.JS) ---
    const container = document.getElementById('canvas-globe');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Criar a Esfera (O Globo)
    const geometry = new THREE.SphereGeometry(1, 64, 64);
    const material = new THREE.MeshPhongMaterial({
        map: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-night.jpg'),
        bumpMap: new THREE.TextureLoader().load('https://unpkg.com/three-globe/example/img/earth-topology.png'),
        bumpScale: 0.05,
        shininess: 5
    });
    const globe = new THREE.Mesh(geometry, material);
    scene.add(globe);

    // Iluminação para dar o efeito 3D real
    const light = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(light);
    const pointLight = new THREE.PointLight(0xff4444, 1); // Luz vermelha lateral
    pointLight.position.set(5, 3, 5);
    scene.add(pointLight);

    camera.position.z = 2.8;

    function animateGlobe() {
        requestAnimationFrame(animateGlobe);
        globe.rotation.y += 0.003; // Rotação contínua
        renderer.render(scene, camera);
    }
    animateGlobe();

    // --- LÓGICA DE DADOS (ABLY + BIGDATACLOUD) ---
    function updateClock() {
        const n = new Date();
        document.getElementById('time').textContent = n.toLocaleTimeString();
        document.getElementById('date').textContent = n.toLocaleDateString('pt-PT', { weekday: 'long', day: 'numeric', month: 'long' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function startSystem() {
        try {
            const res = await fetch("https://api.bigdatacloud.net/data/reverse-geocode-client");
            const d = await res.json();
            
            const geo = {
                city: (d.city || d.locality || "Desconhecido").toUpperCase(),
                country: d.countryName || "Mundo",
                code: (d.countryCode || "pt").toLowerCase(),
                lat: d.latitude,
                lng: d.longitude
            };

            const ably = new Ably.Realtime({ key: ABLY_KEY, clientId: SESSION_ID });
            const channel = ably.channels.get('rau-live-radar');

            ably.connection.on('connected', () => {
                channel.presence.enter(geo);

                channel.presence.subscribe(['enter', 'leave', 'present', 'update'], () => {
                    channel.presence.get((err, members) => {
                        if (!err) {
                            // Contador formatado 00
                            let total = members.length;
                            document.getElementById('visNum').innerText = total < 10 ? "0" + total : total;

                            // Lista de Visitantes
                            const list = document.getElementById("locationData");
                            list.innerHTML = "";
                            members.forEach(member => {
                                const u = member.data;
                                if (u && u.city) {
                                    const div = document.createElement("div");
                                    div.className = "location-item";
                                    div.innerHTML = `<img src="https://flagcdn.com/w40/${u.code}.png"> <span>${u.city} - ${u.country}</span>`;
                                    list.appendChild(div);
                                }
                            });
                        }
                    });
                });
            });
        } catch(e) { console.error("Erro no Radar"); }
    }

    startSystem();
</script>
</body>
</html>
